<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB Quest — Progettazione di database</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#111c2e; --card:#16233a; --card2:#1d2d47;
    --line:#2b3f5e; --txt:#e6edf7; --muted:#8fa3bf;
    --accent:#38bdf8; --accent2:#818cf8; --ok:#22c55e; --ko:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #1a2b48 0%, var(--bg) 60%);
    color:var(--txt); min-height:100vh; padding:18px 16px;
  }
  #app{max-width:1080px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 4px}
  h2{font-size:1.15rem;margin:0 0 10px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
        border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  /* ---------- TOPBAR / AUTH ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
          margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .who .nm{font-weight:600;font-size:.92rem}
  .who .em{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
          display:grid;place-items:center;font-weight:700;font-size:.8rem;overflow:hidden;flex:none}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .badge{font-size:.66rem;padding:3px 8px;border-radius:99px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .badge.admin{background:rgba(129,140,248,.16);color:#a5b4fc;border:1px solid #4f46e5}
  .badge.student{background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid #0369a1}
  .badge.demo{background:rgba(245,158,11,.14);color:#fcd34d;border:1px solid #b45309}
  .login{max-width:440px;margin:8vh auto 0;text-align:center}
  .login .logo{font-size:2.6rem;margin-bottom:6px}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#111827;border:none;border-radius:10px;
        padding:12px 22px;font-weight:600;cursor:pointer;font-size:.95rem;transition:.15s}
  .gbtn:hover{filter:brightness(.94)}
  .field{text-align:left;margin-bottom:10px}
  .field label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
  .field input,.search{width:100%;background:#0d1626;border:1px solid var(--line);border-radius:10px;
        color:var(--txt);padding:10px 12px;font-size:.92rem}
  .field input:focus,.search:focus{outline:none;border-color:var(--accent)}
  .err{color:#fca5a5;font-size:.85rem;margin-top:12px}
  .note{font-size:.78rem;color:var(--muted);margin-top:14px;line-height:1.5}
  /* ---------- STATS / BANNERS ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:#0d1626;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .stat .v{font-size:1.35rem;font-weight:700}
  .stat .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .stat .v.good{color:var(--ok)} .stat .v.bad{color:var(--ko)}
  .banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.9rem;line-height:1.5;
          display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);background:#0d1626}
  .banner .grow{flex:1;min-width:200px}
  .banner.ok{border-color:#15803d;background:rgba(34,197,94,.08)}
  .banner.ko{border-color:#b91c1c;background:rgba(239,68,68,.08)}
  .banner.admin{border-color:#4f46e5;background:rgba(129,140,248,.08)}
  /* ---------- HOME ---------- */
  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .lvl{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
       border-radius:14px;padding:14px;cursor:pointer;transition:.15s;position:relative}
  .lvl:hover{transform:translateY(-3px);border-color:var(--accent)}
  .lvl.locked{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
  .lvl.locked:hover{transform:none;border-color:var(--line)}
  .lvl.done{border-color:#166534}
  .lvl.done::after{content:'✓';position:absolute;top:10px;right:12px;color:var(--ok);font-weight:800}
  .lvl .ic{font-size:1.6rem}
  .lvl .tt{font-weight:600;margin:6px 0 2px}
  .lvl .mt{font-size:.78rem;color:var(--muted)}
  .bar{height:6px;background:#0d1626;border-radius:99px;overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
  /* ---------- GAME ---------- */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;
       padding:9px 16px;font-size:.9rem;cursor:pointer;transition:.15s;font-weight:500}
  .btn:hover{border-color:var(--accent);background:#243b5e}
  .btn.primary{background:linear-gradient(90deg,#0284c7,#6366f1);border:none}
  .btn.primary:hover{filter:brightness(1.15)}
  .btn.danger:hover{border-color:var(--ko);background:#3f1212}
  .btn.sm{padding:6px 11px;font-size:.8rem}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .pill{background:#0d1626;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.8rem;color:var(--muted)}
  .pill.warn{color:#fcd34d;border-color:#92400e}
  .prompt{background:#0d1626;border-left:3px solid var(--accent);border-radius:10px;
          padding:14px 16px;margin-bottom:16px;line-height:1.55;font-size:.95rem}
  .prompt b{color:var(--accent)}
  .zones{display:grid;gap:12px;margin-bottom:14px}
  .zones.cols-2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .zones.cols-3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .zones.cols-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .zone{background:#101b2c;border:2px dashed var(--line);border-radius:14px;padding:10px;
        min-height:90px;transition:.15s}
  .zone.over{border-color:var(--accent);background:#16273f;box-shadow:0 0 0 3px rgba(56,189,248,.12)}
  .zone-title{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
              margin-bottom:8px;font-weight:700}
  .zone-body{display:flex;flex-wrap:wrap;gap:8px;min-height:34px;align-content:flex-start}
  .pool .zone-title{color:var(--accent)}
  .item{background:linear-gradient(180deg,#2a3f61,#1e2e48);border:1px solid #3a5480;
        border-radius:10px;padding:8px 13px;font-size:.86rem;cursor:grab;user-select:none;
        transition:.12s;max-width:100%;white-space:normal}
  .item:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .item.dragging{opacity:.4}
  .item.selected{outline:2px solid var(--accent);outline-offset:2px;
                 background:linear-gradient(180deg,#1e4a6e,#173a58)}
  .item.correct{border-color:var(--ok);background:linear-gradient(180deg,#14532d,#0f3d22)}
  .item.wrong{border-color:var(--ko);background:linear-gradient(180deg,#5c1a1a,#3f1212);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .result{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
          background:#0d1626;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px}
  .result .msg{flex:1;min-width:180px;font-size:.9rem}
  .ok{color:var(--ok);font-weight:700}
  .ko{color:var(--ko);font-weight:700}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .legend{font-size:.78rem;color:var(--muted);margin-top:10px}
  /* ---------- CORSI / SQL ---------- */
  .courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .course .cc-ic{font-size:2.2rem;margin-bottom:6px}
  .course h2{font-size:1.2rem}
  .cc-line{font-size:.9rem;margin-top:10px}
  .course-pill{color:var(--txt)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .lvl.lab{border-color:#0f766e;background:linear-gradient(180deg,#123a3a,#10292c)}
  .lvl.lab:hover{border-color:#5eead4}
  .item.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;white-space:pre-wrap;text-align:left}
  pre.sql,code.ic,.sqlin{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  pre.sql{background:#0a1322;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.84rem;white-space:pre-wrap;overflow-x:auto;margin:10px 0 0;line-height:1.5;color:var(--txt)}
  .prompt pre.sql{font-size:.86rem}
  code.ic{font-size:.85em;background:#0a1322;border-radius:5px;padding:1px 5px;white-space:pre-wrap}
  .hk{color:#c4b5fd;font-weight:700} .hs{color:#86efac} .hn{color:#fdba74}
  .hc{color:#64748b;font-style:italic}
  .expect{background:#0a1322;border:1px solid #0f766e;border-radius:12px;padding:10px 14px;margin-bottom:4px}
  .expect .fb-h{color:#5eead4;margin-bottom:6px}
  .hb{background:rgba(245,158,11,.22);color:#fcd34d;font-weight:800;border-radius:4px;padding:0 3px}
  .sqlin{width:100%;min-height:150px;margin-top:14px;background:#0a1322;border:1px solid var(--line);border-radius:10px;color:var(--txt);
         padding:12px 14px;font-size:.88rem;line-height:1.5;resize:vertical}
  .sqlin:focus{outline:none;border-color:var(--accent)}
  .lab-res{margin-top:14px}
  .lab-res pre.sql{margin-bottom:6px}
  .lab-msg{font-size:.86rem;padding:6px 2px}
  .lab-msg.ok{color:#86efac;font-weight:600} .lab-msg.ko{color:#fca5a5;font-weight:600}
  .lab-msg .em{color:var(--muted);font-weight:400;font-size:.8rem}
  table.tbl.res{min-width:0;font-size:.82rem}
  .tbl.res td,.tbl.res th{padding:5px 10px}
  .tbl.res th{cursor:default;text-transform:none;letter-spacing:0;font-size:.78rem}
  .runout{border-color:#0f766e}
  .runout ul{list-style:none;padding:0}
  .runout li{margin-bottom:10px}
  .runout pre.sql{margin:0 0 2px;font-size:.8rem;padding:6px 10px}
  .viz.tall svg{max-height:460px}
  .certificate.c-sql .frame{border-color:#065f46}
  .certificate.c-sql .c-kicker,.certificate.c-sql .c-name{color:#065f46}
  .certificate.c-sql .c-seal{background:radial-gradient(circle at 35% 30%,#34d399,#065f46);box-shadow:0 0 0 .5cqw #d1fae5}
  /* ---------- CLASSI / SCADENZE ---------- */
  .banner.dl{border-color:#0369a1;background:rgba(56,189,248,.08)}
  .class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:18px 0}
  .class-btn{font-size:1.15rem;font-weight:700;padding:16px 0}
  .sel{width:auto;flex:0 0 auto;padding:8px 10px}
  select.sel{cursor:pointer}
  .dl-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .chip .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font-size:.8rem}
  .chip .x:hover{color:var(--ko)}
  .dlrow .n{color:#7dd3fc}
  details.cls-mgmt > summary{cursor:pointer;font-weight:700;font-size:1.05rem}
  /* ---------- VERIFICA / RIPASSO ---------- */
  .stat .v.warn{color:var(--warn)}
  .banner.warn{border-color:#92400e;background:rgba(245,158,11,.08)}
  .st.verifica{color:#a5b4fc;background:rgba(129,140,248,.14)}
  .lvl.exam{border-color:#4f46e5;background:linear-gradient(180deg,#262f63,#1b2249)}
  .lvl.exam:hover{border-color:#a5b4fc}
  .rules{line-height:1.6;text-align:left;margin:14px auto;max-width:600px;padding-left:22px;font-size:.92rem}
  .rules li{margin-bottom:5px}
  details.rv{text-align:left;margin-top:16px}
  details.rv > summary{cursor:pointer;color:var(--accent);font-weight:600;margin-bottom:10px}
  .rv-g{background:#0d1626;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .rv-p{font-size:.88rem;margin-bottom:8px;line-height:1.5}
  .rv-p b{color:var(--accent)}
  .rv-g ul{margin:0;padding:0;list-style:none}
  .rv-g li{font-size:.86rem;padding:6px 0;border-top:1px solid rgba(43,63,94,.6)}
  .rv-g li > span{display:block;color:var(--muted);font-size:.8rem;margin:2px 0 0 22px}
  /* ---------- ILLUSTRAZIONI ---------- */
  .viz{margin:0 0 16px;background:#0a1322;border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px}
  .viz-scroll{overflow-x:auto}
  .viz svg{display:block;width:100%;min-width:460px;height:auto;max-height:300px}
  .viz-hint{display:none;font-size:.72rem;color:var(--muted);text-align:right;margin-top:4px}
  @media (max-width:520px){ .viz-hint{display:block} }
  .viz figcaption{font-size:.83rem;color:var(--muted);margin-top:8px;line-height:1.45}
  /* ---------- FEEDBACK / TEORIA ---------- */
  .fb{margin-top:12px;background:#0d1626;border:1px solid #92400e;border-radius:12px;padding:12px 16px;font-size:.88rem;line-height:1.5}
  details.fb{border-color:var(--line)}
  .fb summary{cursor:pointer;color:var(--accent);font-weight:600}
  .fb-h{font-weight:700;color:#fcd34d}
  .fb ul{margin:8px 0 0;padding-left:18px}
  .fb li{margin-bottom:7px}
  .fb li > span{display:block;color:var(--muted);font-size:.83rem}
  .fb p{margin:8px 0 0;color:var(--muted)}
  .theory{line-height:1.65;font-size:.95rem}
  .theory ul,.theory ol{padding-left:22px}
  .theory li{margin-bottom:6px}
  .theory b{color:#7dd3fc}
  .theory .tip{background:#0d1626;border-left:3px solid var(--warn);padding:10px 14px;border-radius:8px}
  .theory .ex{background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;
              font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.83rem;white-space:pre-wrap;overflow-x:auto}
  /* ---------- FINAL RESULT ---------- */
  .final{text-align:center;max-width:640px;margin:0 auto}
  .final .big{font-size:3.4rem;font-weight:800;margin:6px 0}
  .final .emo{font-size:3rem}
  /* ---------- ADMIN ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .search{flex:1;min-width:200px;width:auto}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table.tbl{width:100%;border-collapse:collapse;font-size:.85rem;min-width:760px}
  .tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:none}
  .tbl th{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
          background:#0d1626;user-select:none;white-space:nowrap}
  .tbl th:hover{color:var(--txt)}
  .tbl td .em{font-size:.75rem;color:var(--muted)}
  .tbl .mini{height:5px;width:90px;background:#0d1626;border-radius:99px;overflow:hidden;margin-top:4px}
  .tbl .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .st{font-size:.7rem;padding:3px 9px;border-radius:99px;font-weight:700;white-space:nowrap}
  .st.nuovo{color:var(--muted);border:1px solid var(--line)}
  .st.in_corso{color:#fcd34d;background:rgba(245,158,11,.12)}
  .st.superato{color:#86efac;background:rgba(34,197,94,.14)}
  .st.non_superato{color:#fca5a5;background:rgba(239,68,68,.14)}
  .hard{display:grid;gap:8px}
  .hard .h{display:flex;gap:12px;align-items:center;background:#0d1626;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.85rem}
  .hard .h .n{font-weight:700;color:var(--warn);white-space:nowrap}
  .hard .h .t{flex:1;color:var(--muted)}
  .section{margin-top:22px}
  .modal-bg{position:fixed;inset:0;background:rgba(3,7,18,.72);display:grid;place-items:center;padding:16px;z-index:50}
  .modal{max-width:780px;width:100%;max-height:88vh;overflow:auto}
  .dl{margin-bottom:10px}
  .dl-t{font-size:.8rem;font-weight:600;margin-bottom:5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:.75rem;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#0d1626}
  .chip small{color:var(--muted)}
  .chip.ok{border-color:#166534;background:rgba(34,197,94,.1)}
  .chip.wip{border-color:#92400e;background:rgba(245,158,11,.1)}
  .chip.none{opacity:.45}
  .hist{font-size:.85rem;color:var(--muted);line-height:1.7}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0d1626;border:1px solid var(--line);
         border-radius:10px;padding:10px 16px;font-size:.88rem;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
  /* ---------- CERTIFICATE ---------- */
  .cert-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .cert-outer{container-type:inline-size;max-width:960px;margin:0 auto}
  .certificate{aspect-ratio:297/210;width:100%;background:#fffdf7;color:#1f2937;border-radius:6px;position:relative;
               box-shadow:0 20px 50px rgba(0,0,0,.5);padding:3.4cqw;font-family:Georgia,"Times New Roman",serif;
               -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .certificate .frame{position:absolute;inset:2cqw;border:.35cqw double #1e3a8a;border-radius:4px}
  .certificate .inner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
                      justify-content:center;text-align:center;gap:1.1cqw;padding:0 6cqw}
  .c-kicker{font-family:system-ui,sans-serif;letter-spacing:.35em;font-size:1.25cqw;color:#1e3a8a;font-weight:700}
  .c-title{font-size:3.6cqw;color:#0f172a;margin-top:.4cqw}
  .c-small{font-size:1.5cqw;color:#475569;font-style:italic}
  .c-name{font-size:4.2cqw;color:#1e3a8a;border-bottom:.12cqw solid #cbd5e1;padding:0 4cqw .6cqw}
  .c-course{font-size:2.1cqw;font-weight:700;color:#0f172a}
  .c-score{font-size:1.8cqw}
  .c-score b{color:#15803d;font-size:2.6cqw}
  .c-meta{font-family:system-ui,sans-serif;font-size:1.1cqw;color:#64748b}
  .c-foot{display:flex;justify-content:space-between;align-items:flex-end;width:100%;margin-top:2.2cqw;
          font-family:system-ui,sans-serif;font-size:1.1cqw;color:#475569}
  .c-foot > div{width:30%}
  .c-foot b{display:block;color:#0f172a;font-size:1.35cqw;margin-top:.3cqw}
  .c-sign{border-top:.1cqw solid #94a3b8;padding-top:.5cqw}
  .c-seal{position:absolute;right:5.5cqw;top:5cqw;width:9cqw;height:9cqw;border-radius:50%;
          background:radial-gradient(circle at 35% 30%,#60a5fa,#1e3a8a);color:#fff;display:grid;place-items:center;
          font-family:system-ui,sans-serif;font-weight:800;font-size:1.25cqw;text-align:center;line-height:1.2;
          box-shadow:0 0 0 .5cqw #dbeafe}
  @media print{
    @page{size:A4 landscape;margin:0}
    body{background:#fff!important;padding:0!important}
    .no-print{display:none!important}
    #app{max-width:none}
    .cert-outer{max-width:none;width:297mm}
    .certificate{width:297mm;height:210mm;box-shadow:none;border-radius:0}
  }
</style>
</head>
<body>
<div id="app">
  <div style="max-width:520px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;color:#e6edf7;background:#16233a;border:1px solid #2b3f5e;border-radius:16px;text-align:center;line-height:1.5">
    ⏳ Caricamento di DB Quest…<br>
    <small style="color:#8fa3bf">Se questo messaggio resta visibile, il programma con cui hai aperto il file non esegue JavaScript:
    aprilo con Chrome, Edge, Firefox o Safari.</small>

      <li><b>UNIQUE</b>: vieta i duplicati; si usa per le chiavi candidate non scelte come primarie (es. email). Di norma ammette NULL.</li>
      <li><b>NOT NULL</b>: il valore è obbligatorio. <b>CHECK</b>: il valore deve rispettare una condizione (età ≥ 18).</li>

      <li><b>Integrità di entità</b>: la PK è unica e non nulla. <b>Integrità referenziale</b>: ogni FK punta a una riga che esiste.</li>
    </ul>

{
  id:6, title:'ER → Relazionale: relazioni', icon:'🔀',
  theory:`
    <ul>
      <li><b>1:N</b> → la PK del lato “1” va come <b>FK nella tabella del lato N</b> (Ordine contiene id_cliente).</li>

  theory:`
    <p>Quando si cancella una riga “padre” referenziata da righe “figlie”, la FK decide cosa succede:</p>
    <ul>
      <li><b>ON DELETE CASCADE</b>: cancella anche le figlie (cancello l’ordine → spariscono le sue righe).</li>
      <li><b>ON DELETE RESTRICT</b> / NO ACTION: rifiuta la cancellazione finché esistono figlie.</li>
      <li><b>ON DELETE SET NULL</b>: le figlie restano, con la FK a NULL (la FK deve ammettere NULL).</li>
    </ul>
    <p><b>Ordine di creazione</b>: una tabella si crea dopo le tabelle a cui punta con le sue FK.</p>
    <p>Il DBMS <b>rifiuta</b> un’operazione che viola un vincolo: PK duplicata, FK verso una riga inesistente, NULL in colonna NOT NULL, CHECK non rispettato, cancellazione bloccata da RESTRICT.</p>`,

    <p>Una <b>dipendenza funzionale</b> A → B significa: conoscendo A conosco B (id_prodotto → prezzo).</p>
    <ul>
      <li><b>1NF</b>: ogni cella contiene un solo valore atomico (niente liste “333-1, 333-2”).</li>
      <li><b>2NF</b>: 1NF + nessuna <b>dipendenza parziale</b>: con una PK composta, ogni attributo non chiave dipende da <i>tutta</i> la chiave, non da una parte. (Con PK di una sola colonna la 2NF è automatica.)</li>
      <li><b>3NF</b>: 2NF + nessuna <b>dipendenza transitiva</b>: un attributo non chiave non dipende da un altro attributo non chiave (id → id_reparto → nome_reparto).</li>
    </ul>
    <div class="ex">RigaOrdine(id_ordine, id_prodotto, quantità, prezzo_listino)
prezzo_listino dipende solo da id_prodotto → dipendenza PARZIALE → solo 1NF
Correzione: spostare prezzo_listino in Prodotto</div>
    <p class="tip">💡 Ogni passo si risolve <b>spostando</b> gli attributi “fuori posto” in un’altra tabella e collegandola con una FK. Nessun dato va perso: un JOIN ricostruisce la tabella iniziale.</p>`,

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function makeCode(s){
  let h1=0x811c9dc5, h2=0x9e3779b9;
  for(const ch of s){ const c=ch.charCodeAt(0); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; }
  const x=(h1.toString(36)+h2.toString(36)).toUpperCase().padEnd(8,'0');
  return 'DBQ-'+x.slice(0,4)+'-'+x.slice(4,8);
}

/* ---- Allenamento: statistiche personali (non contano per il voto) ---- */
function computeStats(d){
  const games = d?.games || {};
  let solved=0, errors=0, attempts=0;
  for(const g of ALL_GAMES){
    const r = games[gk(g.id)]; if(!r) continue;
    attempts += r.attempts||0; errors += r.errors||0;
    if(r.solved) solved++;

  return {solved, errors, attempts};
}

function attemptView(d, t){

  if(v) return {...t, percent:v.percent, correct:v.correct, total:v.total, passed:v.passed, wrong:v.wrong || t.wrong, validated:true, v};

  return {...t, pending:true};

/* Le domande salvate sono davvero una verifica regolare di questo corso? */
function examStructureError(ex){
  if(!ex || !Array.isArray(ex.games)) return 'verifica mancante';
  const buckets = ex.games.filter(g => !g.write), writes = ex.games.filter(g => g.write);
  if(buckets.length !== LEVELS.length) return 'numero di schermate errato';
  const lv = new Set();
  for(const eg of buckets){
    const g = gameById(eg.id);
    if(!g || g.type === 'order' || g.type === 'write' || g.exam === false) return 'gioco non ammesso: ' + eg.id;
    const L = LEVELS.find(l => l.games.some(x => x.id === g.id)); lv.add(L && L.id);
    const items = eg.items || [];
    if(items.length !== Math.min(CONFIG.EXAM.ITEMS_PER_LEVEL, g.items.length) || new Set(items).size !== items.length
       || !items.every(i => g.items.some(it => it.id === i))) return 'elementi alterati in ' + eg.id;
  }
  if(lv.size !== LEVELS.length) return 'livelli ripetuti';
  if(writes.length !== (COURSE.examWrite || 0)) return 'numero di query errato';
  const wl = new Set(writes.map(eg => { const g = gameById(eg.id); return g && g.type === 'write' ? g.level : null; }));
  if(wl.has(null) || wl.size !== writes.length) return 'query non ammesse';
  return null;
}
function examInfo(d){
  const tries = (d.examAttempts || []).map(t => attemptView(d, t)), used = tries.length, left = Math.max(0, examAllowed(d) - used);
  const pending = tries.find(t => t.pending && t.passed) || null;
  const best = tries.reduce((m,t) => m==null || t.percent > m ? t.percent : m, null);
  const last = tries[used-1];
  let nextAt = null;
  if(last && !d.passed){
    const end = addDays(last.completedAt, CONFIG.EXAM.COOLDOWN_HOURS/24);
    if(!isPast(end) && !(d.cooldownResetAt && d.cooldownResetAt > last.completedAt)) nextAt = end;
  }
  let st;
  if(d.passed) st = 'passed';
  else if(!COURSE.examEnabled) st = 'soon';
  else if(d.exam) st = 'running';
  else if(pending) st = 'pending';
  else if(!trainingDone(d)) st = 'locked';
  else if(left <= 0) st = 'exhausted';
  else if(nextAt) st = 'cooldown';
  else st = 'ready';
  return {st, used, left, best, last, nextAt, pending, tries};
}
function statusOf(d){
  if(d.passed) return 'superato';
  const e = examInfo(d);
  if(e.st === 'exhausted') return 'non_superato';
  if(e.st !== 'locked' && e.st !== 'soon') return 'verifica';
  return computeStats(d).attempts ? 'in_corso' : 'nuovo';
}
/* Un gioco "a contenitori" sorteggiato per ogni livello, con ITEMS_PER_LEVEL elementi sorteggiati */
const WRITE_POINTS = 2;   // una query scritta nella verifica vale 2 punti
const pick = a => a[Math.floor(Math.random()*a.length)];
function buildExam(){
  const games = LEVELS.map(lv => {
    const pool = lv.games.filter(g => g.type !== 'order' && g.type !== 'write' && g.exam !== false);
    const g = pick(pool);
    return {id:g.id, items: sampleItems({...g, show:CONFIG.EXAM.ITEMS_PER_LEVEL}).map(it => it.id)};
  });
  /* query da scrivere: livelli diversi, scelti a caso tra quelli che ne hanno */
  const wl = shuffle(LEVELS.filter(l => l.games.some(g => g.type === 'write'))).slice(0, COURSE.examWrite || 0)
             .sort((a,b) => a.id - b.id);
  for(const l of wl) games.push({id: pick(l.games.filter(g => g.type === 'write')).id, write:true});
  return {startedAt:nowISO(), step:0, games, answers:{}};
}
function examGameData(eg){
  const g = gameById(eg.id);
  if(eg.write) return normalize(g);
  return {...g, items: shuffle(eg.items.map(iid => g.items.find(it => it.id === iid)))};
}
/* Correzione: 1 punto per elemento, WRITE_POINTS per ogni query scritta (provata anche sui dati nascosti) */
async function scoreExam(ex){
  let correct = 0, total = 0; const wrong = [], all = [], writeRes = {};
  for(const eg of ex.games){
    const g = gameById(eg.id), ans = ex.answers[eg.id] || {};
    if(eg.write){
      const key = eg.id+'|*'; all.push(key); total += WRITE_POINTS;
      let r; try{ r = await checkQuery(g, ans.sql || ''); }catch(e){ r = {ok:false, msg:'Motore SQL non disponibile.'}; }
      writeRes[eg.id] = {ok:r.ok, msg:r.msg};
      if(r.ok) correct += WRITE_POINTS; else wrong.push(key);
      continue;
    }
    for(const iid of eg.items){
      const it = g.items.find(x => x.id === iid), key = eg.id+'|'+iid;
      all.push(key); total++;
      if(ans[iid] === it.answer) correct++; else wrong.push(key);
    }
  }
  return {correct, total, percent:Math.round(1000*correct/total)/10, wrong, all, writeRes};
}

/* ---- Ripasso distanziato: una scheda per elemento sbagliato ('gioco|elemento', '*' = gioco di ordinamento intero) ---- */
function validReviewKey(k){
  const [gid, iid] = k.split('|'), g = gameById(gid);
  return !!g && (iid === '*' ? (g.type === 'order' || g.type === 'write') : g.type !== 'order' && g.type !== 'write' && g.items.some(it => it.id === iid));
}
function reviewAdd(d, keys){
  d.review = d.review || {};
  const due = addDays(nowISO(), CONFIG.REVIEW.DAYS[0]);
  for(const k of keys){
    const r = d.review[k] || {added:nowISO(), lapses:0};
    r.streak = 0; r.lapses = (r.lapses||0) + 1; r.due = due;
    d.review[k] = r;
  }
}
function reviewRecord(d, key, correct){
  const r = d.review?.[key]; if(!r) return null;
  if(correct){
    r.streak = (r.streak||0) + 1;
    if(r.streak >= CONFIG.REVIEW.TO_MASTER){ delete d.review[key]; d.reviewMastered = (d.reviewMastered||0) + 1; return 'mastered'; }
    r.due = addDays(nowISO(), CONFIG.REVIEW.DAYS[Math.min(r.streak, CONFIG.REVIEW.DAYS.length-1)]);
  } else {
    r.streak = 0; r.lapses = (r.lapses||0) + 1; r.due = addDays(nowISO(), CONFIG.REVIEW.DAYS[0]);
  }
  return correct ? 'ok' : 'ko';
}
function reviewInfo(d){
  const all = Object.entries(d.review || {}).filter(([k]) => validReviewKey(k));
  const due = all.filter(([,r]) => isPast(r.due));
  const next = all.filter(([,r]) => !isPast(r.due)).map(([,r]) => r.due).sort()[0] || null;
  return {total:all.length, due:due.length, dueKeys:due.map(([k]) => k), next};
}
/* Sessione breve e mescolata (interleaving): al massimo SESSION_MAX schede, raggruppate per gioco */
function buildReviewSession(d){
  const byGame = {};
  for(const k of reviewInfo(d).dueKeys){ const [gid, iid] = k.split('|'); (byGame[gid] = byGame[gid] || []).push(iid); }
  const groups = []; let n = 0;
  for(const gid of shuffle(Object.keys(byGame))){
    if(n >= CONFIG.REVIEW.SESSION_MAX) break;
    const ids = byGame[gid];
    if(ids.includes('*')){ groups.push({gid, whole:true}); n++; }
    else { const take = shuffle(ids).slice(0, CONFIG.REVIEW.SESSION_MAX - n); groups.push({gid, items:take}); n += take.length; }
  }
  return {groups, idx:0, right:0, total:0, mastered:0};
}

const VC = {ent:'#38bdf8', entF:'#122c45', rel:'#a5b4fc', relF:'#262c57', att:'#94a3b8',

            warn:'#fbbf24', line:'#33496d', paper:'#0d1626', head:'#16233a'};
const FONT = 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
function TW(s, px){
  let w = 0;
  for(const ch of String(s)){
    if(/[ilj.,:;'’|!()\[\]]/.test(ch)) w += .3;
    else if(/[mwMW]/.test(ch)) w += .85;
    else if(/[A-ZÀ-Ý]/.test(ch)) w += .66;
    else if(ch.codePointAt(0) > 0x2000) w += 1.15;
    else w += .56;
  }
  return w * px;
}
function wrapText(s, maxW, px){
  const words = String(s).split(/\s+/), lines = []; let cur = '';
  for(const w of words){
    const t = cur ? cur + ' ' + w : w;
    if(TW(t,px) > maxW && cur){ lines.push(cur); cur = w; } else cur = t;
  }
  if(cur) lines.push(cur);
  return lines;
}
const sv = {

/* ---------- Diagramma ER ---------- */
function vizER(v){
  const W = v.w||640, H = v.h||200, E = {};
  let back = '', mid = '', front = '';
  for(const e of v.ents){ E[e.id||e.n] = {...e, w:Math.max(86, TW(e.n,13)+30), h:36}; }

  function attrs(cx, cy, ew, eh, list, side='top'){
    if(!list || !list.length) return;
    const items = list.map(a=>{
      const o = typeof a==='string' ? {n:a} : {...a};
      let n = o.n;
      if(n.startsWith('#')){ o.key = true; n = n.slice(1); }
      if(n.endsWith('+')){ o.multi = true; n = n.slice(0,-1); }
      o.n = n; o.rx = TW(n,11.5)/2 + 11; o.ry = 12; return o;
    });
    const gap = 10;
    if(side==='top' || side==='bottom'){
      const tot = items.reduce((s,o)=>s+2*o.rx+(o.multi?6:0),0) + gap*(items.length-1);
      let x = cx - tot/2; const y = side==='top' ? cy-eh/2-36 : cy+eh/2+36;
      items.forEach(o=>{ const w = 2*o.rx+(o.multi?6:0); o.x = x+w/2; o.y = y; x += w+gap; });
    } else {
      let y = cy - (items.length-1)*16;
      items.forEach(o=>{ o.x = side==='right' ? cx+ew/2+34+o.rx : cx-ew/2-34-o.rx; o.y = y; y += 32; });
    }
    for(const o of items){
      let ax, ay;
      if(side==='top' || side==='bottom'){
        ax = Math.max(cx-ew/2+8, Math.min(cx+ew/2-8, cx+(o.x-cx)*.35)); ay = side==='top' ? cy-eh/2 : cy+eh/2;
      } else { ax = side==='right' ? cx+ew/2 : cx-ew/2; ay = cy; }
      back += sv.line(ax, ay, o.x, o.y, VC.att, 1.2);
      if(o.parts){
        const ps = o.parts.map(p=>({n:p, rx:TW(p,11)/2+10}));
        const tot = ps.reduce((s,p)=>s+2*p.rx,0) + 8*(ps.length-1);
        let x = o.x - tot/2; const py = side==='bottom' ? o.y+40 : o.y-40;
        for(const p of ps){
          const px = x+p.rx; x += 2*p.rx+8;
          back += sv.line(o.x, o.y, px, py, VC.att, 1.1);
          front += `<ellipse cx="${px}" cy="${py}" rx="${p.rx}" ry="11" fill="${VC.paper}" stroke="${VC.att}" stroke-width="1.1"/>` + sv.text(px, py+4, p.n, {size:11});
        }
      }
      const st = o.key ? VC.key : VC.att;
      if(o.multi) front += `<ellipse cx="${o.x}" cy="${o.y}" rx="${o.rx+3.5}" ry="${o.ry+3.5}" fill="${VC.paper}" stroke="${st}" stroke-width="1.2"/>`;
      front += `<ellipse cx="${o.x}" cy="${o.y}" rx="${o.rx}" ry="${o.ry}" fill="${VC.paper}" stroke="${st}" stroke-width="1.4"/>`;
      front += sv.text(o.x, o.y+4, o.n, {size:11.5, fill:o.key?VC.key:VC.txt, weight:o.key?600:400});
      if(o.key){ const tw = TW(o.n,11.5)/2; front += sv.line(o.x-tw, o.y+6.5, o.x+tw, o.y+6.5, VC.key, 1); }
    }
  }
  function diamond(x,y,n,ident){
    const hw = Math.max(40, TW(n,12)/2+24), hh = 22;
    let s = `<polygon points="${x-hw},${y} ${x},${y-hh} ${x+hw},${y} ${x},${y+hh}" fill="${VC.relF}" stroke="${VC.rel}" stroke-width="1.6"/>`;
    if(ident) s += `<polygon points="${x-hw+7},${y} ${x},${y-hh+4} ${x+hw-7},${y} ${x},${y+hh-4}" fill="none" stroke="${VC.rel}" stroke-width="1.2"/>`;
    return {svg: s + sv.text(x, y+4, n, {size:12, weight:600}), hw, hh};
  }
  function card(A, x, y, label){
    const dx = x-A.x, dy = y-A.y, len = Math.hypot(dx,dy)||1, ux = dx/len, uy = dy/len;
    const t = Math.min(Math.abs(dx)>.01 ? (A.w/2)/Math.abs(dx) : 1e9, Math.abs(dy)>.01 ? (A.h/2)/Math.abs(dy) : 1e9);
    const px = A.x+dx*t, py = A.y+dy*t;
    let lx, ly;
    if(Math.abs(uy) < .45){ lx = px+ux*28; ly = py-8; } else { lx = px+16+TW(label,11.5)/2; ly = py+uy*18+4; }
    return sv.text(lx, ly, label, {size:11.5, fill:VC.card, weight:600});
  }

  for(const r of v.rels||[]){
    const A = E[r.a], B = E[r.b];
    if(r.a === r.b){
      const x = r.x, y = r.y, d = diamond(x,y,r.n,r.ident);
      const lA = [A.x-A.w/4, A.y-A.h/2], rA = [A.x+A.w/4, A.y-A.h/2];
      back += `<polyline points="${lA} ${x-d.hw},${y}" fill="none" stroke="${VC.rel}" stroke-width="1.4"/>`;
      back += `<polyline points="${rA} ${x+d.hw},${y}" fill="none" stroke="${VC.rel}" stroke-width="1.4"/>`;
      mid += d.svg;
      if(r.ca) front += sv.text(lA[0]-30, lA[1]-6, r.ca, {size:11.5, fill:VC.card, weight:600});
      if(r.cb) front += sv.text(rA[0]+30, rA[1]-6, r.cb, {size:11.5, fill:VC.card, weight:600});
      if(r.roles){ front += sv.text(lA[0]-30, lA[1]-22, r.roles[0], {size:10.5, fill:VC.mut, italic:true}) + sv.text(rA[0]+30, rA[1]-22, r.roles[1], {size:10.5, fill:VC.mut, italic:true}); }
      continue;
    }
    const x = r.x ?? (A.x+B.x)/2, y = r.y ?? (A.y+B.y)/2;
    back += sv.line(A.x, A.y, x, y, VC.rel, 1.5) + sv.line(B.x, B.y, x, y, VC.rel, 1.5);
    const d = diamond(x, y, r.n, r.ident); mid += d.svg;
    if(r.ca) front += card(A, x, y, r.ca);
    if(r.cb) front += card(B, x, y, r.cb);
    attrs(x, y, 0, 2*d.hh, r.attrs, r.side||'top');
  }
  for(const r of v.rels3||[]){
    for(const id of r.ents){ const A = E[id]; back += sv.line(A.x, A.y, r.x, r.y, VC.rel, 1.5); }
    mid += diamond(r.x, r.y, r.n).svg;
  }
  if(v.gen){
    const S = E[v.gen.sup], subs = v.gen.subs.map(s=>E[s]);
    const jy = (S.y+S.h/2 + Math.min(...subs.map(s=>s.y-s.h/2)))/2;
    for(const s of subs) back += `<path d="M${s.x},${s.y-s.h/2} V${jy} H${S.x}" fill="none" stroke="${VC.ent}" stroke-width="1.5"/>`;
    back += `<line x1="${S.x}" y1="${jy}" x2="${S.x}" y2="${S.y+S.h/2+2}" stroke="${VC.ent}" stroke-width="1.8" marker-end="url(#vz-ent)"/>`;
  }
  for(const id in E){
    const e = E[id];
    mid += sv.rect(e.x-e.w/2, e.y-e.h/2, e.w, e.h, {fill:VC.entF, stroke:VC.ent, sw:1.7, rx:4});
    if(e.weak) mid += sv.rect(e.x-e.w/2+4, e.y-e.h/2+4, e.w-8, e.h-8, {stroke:VC.ent, sw:1.1, rx:2});
    mid += sv.text(e.x, e.y+5, e.n, {size:13, weight:700});
    attrs(e.x, e.y, e.w, e.h, e.attrs, e.side||'top');
  }
  return svgWrap(W, H, back + mid + front + notesSVG(v.notes));
}

/* ---------- Tabelle relazionali ---------- */
function vizTables(v){
  const W = v.w||640, H = v.h||200, T = {}, RH = 22, HH = 24;
  let back = '', body = '';
  for(const t of v.tables){
    const cols = t.cols.map(c=>{
      const o = {}; let s = c; const bar = s.indexOf('|');
      if(bar >= 0){ o.badge = s.slice(bar+1); s = s.slice(0,bar); }
      while(/^[#>]/.test(s)){ if(s[0]==='#') o.pk = true; else o.fk = true; s = s.slice(1); }
      o.n = s; return o;
    });
    const rows = t.rows||[];
    cols.forEach((c,i)=>{
      let w = TW(c.n,11.5) + (c.pk?17:0) + 22;
      if(c.badge) w = Math.max(w, TW(c.badge,9.5)+24);
      rows.forEach(r=>{ w = Math.max(w, TW(String(r[i]).replace(/^[!^]/,''),11.5)+20); });
      c.w = Math.ceil(w);
    });
    const tw = Math.max(cols.reduce((s,c)=>s+c.w,0), TW(t.n,12.5)+(t.tag?TW(t.tag,10.5)+26:0)+24);
    if(cols.length) cols[cols.length-1].w += tw - cols.reduce((s,c)=>s+c.w,0);
    let cx = t.x; cols.forEach(c=>{ c.x = cx; cx += c.w; });
    const hasBadge = cols.some(c=>c.badge);
    const top = t.y, colY = top+HH, dataY = colY+HH+(hasBadge?13:0), h = (dataY-top) + rows.length*RH;
    T[t.id||t.n] = {...t, cols, tw, top, h, bottom:top+h};
    body += sv.rect(t.x, top, tw, h, {fill:VC.paper, stroke:VC.line, sw:1.3, rx:6});
    body += `<path d="M${t.x},${top+HH} V${top+6} q0,-6 6,-6 H${t.x+tw-6} q6,0 6,6 V${top+HH} Z" fill="${VC.head}"/>`;
    body += sv.text(t.x+10, top+16.5, t.n, {size:12.5, weight:700, anchor:'start'});
    if(t.tag) body += sv.text(t.x+tw-9, top+16, t.tag, {size:10.5, fill:VC.mut, anchor:'end', italic:true});
    body += sv.line(t.x, top+HH, t.x+tw, top+HH, VC.line, 1.1) + sv.line(t.x, dataY, t.x+tw, dataY, VC.line, 1.1);
    cols.forEach((c,i)=>{
      if(i) body += sv.line(c.x, top+HH, c.x, top+h, VC.line, .8);
      const col = c.pk ? VC.key : c.fk ? VC.fk : VC.txt;
      const label = (c.pk ? '🔑 ' : '') + c.n;
      body += sv.text(c.x+9, colY+16, label, {size:11.5, fill:col, anchor:'start', weight:c.pk||c.fk?700:600, italic:!!c.fk});
      if(c.badge){
        const bw = TW(c.badge,9.5)+12;
        body += sv.rect(c.x+8, colY+21, bw, 13, {fill:'rgba(196,181,253,.15)', stroke:'#8b5cf6', sw:.8, rx:6});
        body += sv.text(c.x+8+bw/2, colY+31, c.badge, {size:9.5, fill:'#c4b5fd', weight:600});
      }
    });
    rows.forEach((r,ri)=>{
      const y = dataY + ri*RH;
      if(ri) body += sv.line(t.x, y, t.x+tw, y, VC.line, .6);
      r.forEach((val,ci)=>{
        const c = cols[ci]; if(!c) return;
        let s = String(val), fill = null;
        if(s[0]==='!'){ fill = 'rgba(248,113,113,.28)'; s = s.slice(1); }
        else if(s[0]==='^'){ fill = 'rgba(252,211,77,.2)'; s = s.slice(1); }
        if(fill) body += sv.rect(c.x+2, y+2, c.w-4, RH-4, {fill, rx:3});
        body += sv.text(c.x+9, y+15.5, s, {size:11.5, fill:s==='NULL'?VC.mut:VC.txt, anchor:'start', italic:s==='NULL'});
      });
    });
  }
  const colOf = ref => { const [tn,cn] = ref.split('.'); const t = T[tn]; return {t, c:t.cols.find(c=>c.n===cn)}; };
  (v.links||[]).forEach((l,i)=>{
    const f = colOf(l.from), to = colOf(l.to);
    const fx = f.c.x+f.c.w/2, tx = to.c.x+to.c.w/2 + (f.t===to.t ? 0 : 0);
    const uy = Math.min(f.t.top, to.t.top) - 14 - (l.lvl||0)*12;
    back += `<path d="M${fx},${f.t.top} V${uy} H${tx} V${to.t.top-1}" fill="none" stroke="${VC.fk}" stroke-width="1.6" marker-end="url(#vz-fk)"/>`;
    back += `<circle cx="${fx}" cy="${f.t.top}" r="2.6" fill="${VC.fk}"/>`;
    if(l.label) back += sv.text(tx < fx ? fx-6 : fx+6, uy-5, l.label, {size:10.5, fill:VC.fk, weight:600, anchor:tx < fx ? 'end' : 'start'});
  });
  (v.fds||[]).forEach(fd=>{
    const t = T[fd.t], a = t.cols.find(c=>c.n===fd.from), b = t.cols.find(c=>c.n===fd.to);
    const ax = a.x+a.w/2, bx = b.x+b.w/2, y0 = t.bottom, c = fd.kind==='p' ? VC.ko : VC.warn;
    back += `<path d="M${ax},${y0+3} C${ax},${y0+32} ${bx},${y0+32} ${bx},${y0+5}" fill="none" stroke="${c}" stroke-width="1.7" marker-end="url(#vz-${fd.kind==='p'?'ko':'warn'})"/>`;
    back += sv.text((ax+bx)/2, y0+40, fd.kind==='p' ? 'dipendenza parziale' : 'dipendenza transitiva', {size:10.5, fill:c, weight:600});
  });
  (v.arrows||[]).forEach(a=>{
    back += `<line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="${VC.mut}" stroke-width="2" marker-end="url(#vz-mut)"/>`;
    if(a.t) back += sv.text((a.x1+a.x2)/2, Math.min(a.y1,a.y2)-8, a.t, {size:10.5, fill:VC.mut, italic:true});
  });
  return svgWrap(W, H, body + back + notesSVG(v.notes));
}

/* ---------- Flusso / schede con icone ---------- */
function vizFlow(v){
  const W = v.w||640, H = v.h||160, n = v.nodes.length, pad = 6;
  const arrows = v.arrows !== false, gap = arrows ? 26 : 12;
  const nw = (W-2*pad-gap*(n-1))/n;
  const nh = v.nh || Math.max(...v.nodes.map(nd => 52 + wrapText(nd.t, nw-16, 12.5).length*16 + (nd.s ? wrapText(nd.s, nw-14, 11).length*14 + 4 : 0) + 8));
  let s = '';
  const pos = v.nodes.map((nd,i)=>{
    const x = pad + i*(nw+gap);
    const y = v.stairs ? (H-nh-4) - i*((H-nh-10)/Math.max(1,n-1)) : (H-nh)/2;
    return {x,y};
  });
  v.nodes.forEach((nd,i)=>{
    const {x,y} = pos[i], cx = x+nw/2;
    s += sv.rect(x, y, nw, nh, {fill:VC.paper, stroke:nd.c||VC.line, sw:1.4, rx:12});
    s += sv.text(cx, y+33, nd.i, {size:24});
    let ty = y+56;
    for(const l of wrapText(nd.t, nw-16, 12.5)){ s += sv.text(cx, ty, l, {size:12.5, weight:700}); ty += 16; }
    if(nd.s) for(const l of wrapText(nd.s, nw-14, 11)){ s += sv.text(cx, ty+2, l, {size:11, fill:VC.mut}); ty += 14; }
    if(arrows && i < n-1){
      const ay = v.stairs ? (pos[i].y + pos[i+1].y)/2 + nh/2 : y+nh/2;
      s += `<line x1="${x+nw+3}" y1="${ay}" x2="${x+nw+gap-3}" y2="${ay}" stroke="${VC.mut}" stroke-width="1.8" marker-end="url(#vz-mut)"/>`;
    }
  });
  return svgWrap(W, H, s + notesSVG(v.notes));
}

/* ---------- Testo dei requisiti evidenziato ---------- */
function vizReq(v){
  const W = v.w||640, PX = 15, LH = 34, KC = {n:VC.ent, v:VC.rel, a:VC.ok, s:VC.warn};
  const LEG = {n:'sostantivo → entità', v:'verbo → relazione', a:'proprietà → attributo', s:'sinonimo → stessa entità'};
  const pieces = []; const re = /\[(n|v|a|s):([^\]]+)\]|([^\[]+)/g; let m;
  while((m = re.exec(v.text))){
    if(m[1]) pieces.push({k:m[1], t:m[2]});
    else m[3].split(/(\s+)/).filter(x=>x && !/^\s+$/.test(x)).forEach(t=>pieces.push({t}));
  }
  let x = 34, y = 52, s = ''; const maxX = W-60, used = new Set();
  for(const p of pieces){
    if(!p.k && /^[.,;:!?]/.test(p.t)) x -= 5;
    const w = TW(p.t,PX) + (p.k ? 12 : 0);
    if(x + w > maxX){ x = 34; y += LH; }
    if(p.k){
      used.add(p.k);
      s += sv.rect(x-2, y-17, w, 24, {fill:KC[p.k]+'2e', stroke:KC[p.k], sw:1.2, rx:6, dash:p.k==='s'?'4 3':''});
      s += sv.text(x-2+w/2, y, p.t, {size:PX, weight:600});
    } else s += sv.text(x, y, p.t, {size:PX, anchor:'start', fill:'#cbd5e1'});
    x += w + 6;
  }
  const paperH = y + 24 - 14;
  let out = sv.rect(14, 14, W-28, paperH, {fill:VC.paper, stroke:VC.line, sw:1.3, rx:10});
  out += sv.text(30, 30, '📄 Requisiti', {size:10.5, fill:VC.mut, anchor:'start'});
  out += s.replace(/y="(\d+(\.\d+)?)"/g, (mm,n)=>`y="${+n+8}"`);
  let lx = 16; const ly = paperH + 38;
  for(const k of ['n','v','a','s']) if(used.has(k)){
    const t = LEG[k], w = TW(t,11)+26;
    out += sv.rect(lx, ly-13, w, 20, {fill:KC[k]+'22', stroke:KC[k], sw:1, rx:10, dash:k==='s'?'4 3':''});
    out += sv.text(lx+w/2, ly+1, t, {size:11, weight:600});
    lx += w + 8;
  }
  return svgWrap(W, ly+16, out);
}

/* Adatta il riquadro al disegno reale (misure esatte del browser), con larghezza minima costante */
function fitViz(root=document){
  root.querySelectorAll('.viz svg').forEach(svg=>{
    try{
      const b = svg.getBBox(), W0 = +svg.dataset.w || 640, pad = 12;
      if(!b.width) return;
      let w = b.width + 2*pad, x = b.x - pad;
      if(w < W0){ x = b.x + b.width/2 - W0/2; w = W0; }
      svg.setAttribute('viewBox', `${x} ${b.y-pad} ${w} ${b.height+2*pad}`);
    }catch(e){}
  });
}
function vizHTML(key){ return vizSpecHTML(VIZ[key]); }
function vizSpecHTML(v){
  if(!v) return '';
  let svg = '';
  try{
    svg = v.type==='er' ? vizER(v) : v.type==='tables' ? vizTables(v) : v.type==='flow' ? vizFlow(v) : v.type==='req' ? vizReq(v) : v.type==='schema' ? vizSchema(v) : '';
  }catch(e){ console.error('viz', e); return ''; }
  return `<figure class="viz${v.tall ? ' tall' : ''}"><div class="viz-scroll">${svg}</div><div class="viz-hint">↔ scorri l’immagine o allarga con due dita</div>${v.cap ? `<figcaption>🧠 ${esc(v.cap)}</figcaption>` : ''}</figure>`;
}

const AZ_SCHEMA = `CREATE TABLE Cliente (
  id_cliente      INTEGER PRIMARY KEY,
  ragione_sociale VARCHAR(60) NOT NULL,
  citta           VARCHAR(40),
  email           VARCHAR(80) UNIQUE
);
CREATE TABLE Prodotto (
  id_prodotto INTEGER PRIMARY KEY,
  descrizione VARCHAR(60) NOT NULL,
  prezzo      DECIMAL(8,2) NOT NULL CHECK (prezzo >= 0),
  giacenza    INTEGER NOT NULL DEFAULT 0 CHECK (giacenza >= 0)
);
CREATE TABLE Ordine (
  id_ordine  INTEGER PRIMARY KEY,
  id_cliente INTEGER NOT NULL,
  data       DATE NOT NULL,
  FOREIGN KEY (id_cliente) REFERENCES Cliente(id_cliente) ON DELETE RESTRICT
);
CREATE TABLE RigaOrdine (
  id_ordine       INTEGER NOT NULL,
  id_prodotto     INTEGER NOT NULL,
  quantita        INTEGER NOT NULL CHECK (quantita > 0),
  prezzo_unitario DECIMAL(8,2) NOT NULL,
  PRIMARY KEY (id_ordine, id_prodotto),
  FOREIGN KEY (id_ordine)   REFERENCES Ordine(id_ordine)     ON DELETE CASCADE,
  FOREIGN KEY (id_prodotto) REFERENCES Prodotto(id_prodotto) ON DELETE RESTRICT
);
CREATE TABLE Fattura (
  id_fattura INTEGER PRIMARY KEY,
  id_ordine  INTEGER NOT NULL UNIQUE,
  data       DATE NOT NULL,
  totale     DECIMAL(8,2) NOT NULL CHECK (totale >= 0),
  FOREIGN KEY (id_ordine) REFERENCES Ordine(id_ordine)
);`;

/* ---------- Schema logico disegnato a riquadri (usato anche dal Laboratorio) ---------- */
function vizSchema(v){
  const W = v.w||640, H = v.h||200, B = {}, RH = 20, HH = 26;
  let body = '', front = '';
  for(const b of v.boxes){
    const cols = b.cols.map(c=>{
      const o = {}; let s = c;
      while(/^[#>]/.test(s)){ if(s[0]==='#') o.pk = true; else o.fk = true; s = s.slice(1); }
      o.n = s; return o;
    });
    const w = Math.ceil(Math.max(TW(b.n,13)+30, ...cols.map(c => TW(c.n,11.5) + (c.pk?20:0) + 26)));
    const h = HH + cols.length*RH + 6;
    B[b.id||b.n] = {...b, cols, w, h};
    body += sv.rect(b.x, b.y, w, h, {fill:VC.paper, stroke:VC.line, sw:1.3, rx:7});
    body += `<path d="M${b.x},${b.y+HH} V${b.y+7} q0,-7 7,-7 H${b.x+w-7} q7,0 7,7 V${b.y+HH} Z" fill="${VC.head}"/>`;
    body += sv.text(b.x+10, b.y+17.5, b.n, {size:13, weight:700, anchor:'start'});
    cols.forEach((c,i)=>{
      c.cy = b.y + HH + i*RH + RH/2 + 3;
      body += sv.text(b.x+10, c.cy+4, (c.pk?'🔑 ':'') + c.n, {size:11.5, anchor:'start', fill:c.fk?VC.fk:c.pk?VC.key:VC.txt, weight:c.pk||c.fk?700:400, italic:!!c.fk});
    });
  }
  const find = ref => { const [t,c] = ref.split('.'); const bx = B[t]; return bx && {bx, c: bx.cols.find(x => x.n === c) || bx.cols[0]}; };
  (v.links||[]).forEach((l,i)=>{
    const f = find(l.from), t = find(l.to); if(!f || !t) return;
    const fb = f.bx, tb = t.bx, fy = f.c.cy, ty = t.c.cy;
    const overlap = fb.x < tb.x+tb.w && tb.x < fb.x+fb.w;
    let d, fx;
    if(overlap || fb === tb){
      fx = fb.x; const tx = tb.x, bulge = 34 + (i%3)*10;
      d = `M${fx},${fy} C${fx-bulge},${fy} ${tx-bulge},${ty} ${tx-2},${ty}`;
    } else {
      const right = tb.x > fb.x;
      fx = right ? fb.x+fb.w : fb.x; const tx = right ? tb.x : tb.x+tb.w;
      const dx = Math.max(28, Math.abs(tx-fx)/2) * (right ? 1 : -1);
      d = `M${fx},${fy} C${fx+dx},${fy} ${tx-dx},${ty} ${tx + (right?-2:2)},${ty}`;
    }
    front += `<path d="${d}" fill="none" stroke="${VC.fk}" stroke-width="1.6" marker-end="url(#vz-fk)"/><circle cx="${fx}" cy="${fy}" r="2.6" fill="${VC.fk}"/>`;
  });
  return svgWrap(W, H, body + front + notesSVG(v.notes));
}
/* Disegna automaticamente lo schema di un database SQLite: colonne = "giri" di creazione */
function schemaSpecFromDB(db){
  const q = sql => { const r = db.exec(sql); return r.length ? r[0].values : []; };
  const tabs = q("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY rowid").map(r=>r[0]);
  const info = {};
  for(const t of tabs){
    const cols = q(`PRAGMA table_info("${t.replace(/"/g,'""')}")`);
    const fks = q(`PRAGMA foreign_key_list("${t.replace(/"/g,'""')}")`);
    const pkCols = cols.filter(c=>c[5]>0).map(c=>c[1]);
    info[t] = {cols, fks, pkCols};
  }
  const depth = {}, visiting = new Set();
  const dep = t => {
    if(depth[t] != null) return depth[t];
    if(visiting.has(t) || !info[t]) return 0;
    visiting.add(t);
    const parents = info[t].fks.map(f=>f[2]).filter(p => p !== t && info[p]);
    depth[t] = parents.length ? 1 + Math.max(...parents.map(dep)) : 0;
    visiting.delete(t); return depth[t];
  };
  tabs.forEach(dep);
  const byCol = {};
  tabs.forEach(t => (byCol[depth[t]] = byCol[depth[t]] || []).push(t));
  const boxes = [], links = []; let x = 10;
  Object.keys(byCol).map(Number).sort((a,b)=>a-b).forEach(c=>{
    let y = 30, maxW = 0;
    for(const t of byCol[c]){
      const I = info[t], fkCols = new Set(I.fks.map(f=>f[3]));
      const cols = I.cols.map(cl => (I.pkCols.includes(cl[1])?'#':'') + (fkCols.has(cl[1])?'>':'') + cl[1]);
      boxes.push({n:t, x, y, cols});
      const w = Math.max(TW(t,13)+30, ...cols.map(s => TW(s.replace(/^[#>]+/,''),11.5) + (s.startsWith('#')?20:0) + 26));
      maxW = Math.max(maxW, w); y += 26 + cols.length*20 + 6 + 28;
      for(const f of I.fks){
        const target = info[f[2]]; if(!target) continue;
        links.push({from:`${t}.${f[3]}`, to:`${f[2]}.${f[4] || target.pkCols[0] || ''}`});
      }
    }
    x += maxW + 70;
  });
  return {type:'schema', w:Math.max(480, x), h:300, boxes, links};
}

/* ---------- Motore SQL nel browser (SQLite / sql.js), caricato solo quando serve ---------- */
const SQLJS_VERSION = '1.13.0';
let sqlPromise = null;
function getSQL(){
  if(!sqlPromise){
    sqlPromise = new Promise((resolve, reject)=>{
      const base = `https://cdn.jsdelivr.net/npm/sql.js@${SQLJS_VERSION}/dist/`;
      const go = () => window.initSqlJs({locateFile: f => base + f}).then(resolve, reject);
      if(window.initSqlJs) return go();
      const s = document.createElement('script');
      s.src = base + 'sql-wasm.js'; s.onload = go;
      s.onerror = () => reject(new Error('Impossibile caricare il motore SQL'));
      document.head.appendChild(s);
    });
    sqlPromise.catch(()=>{ sqlPromise = null; });
  }
  return sqlPromise;
}
/* mode: 'schema' (tabelle vuote) | 'data' (dati di base, livelli 1-2) | 'full' (dati completi) | 'hidden' (completi + variante nascosta) */
function makeCompanyDB(SQL, mode = 'full'){
  if(mode === true) mode = 'data';
  if(mode === false) mode = 'schema';
  const db = new SQL.Database();
  db.run('PRAGMA foreign_keys = ON;');
  db.exec(AZ_SCHEMA);
  if(mode !== 'schema') db.exec(AZ_DATA);
  if(mode === 'full' || mode === 'hidden') db.exec(AZ_DATA_MORE);
  if(mode === 'hidden') db.exec(AZ_DATA_HIDDEN);
  return db;
}
const isDDL = s => /^\s*(CREATE|DROP|ALTER|PRAGMA)\b/i.test(s);
/* Esegue uno o più comandi; si ferma al primo errore, come un DBMS in modalità autocommit */
function runStatements(db, sql){
  const out = [];
  let it;
  try{ it = db.iterateStatements(sql); }catch(e){ return [{sql, error:e.message}]; }
  for(;;){
    let r;
    try{ r = it.next(); }catch(e){ out.push({sql:it.getRemainingSQL ? it.getRemainingSQL() : sql, error:e.message}); break; }
    if(r.done) break;
    const st = r.value, text = st.getSQL().trim();
    try{
      const cols = st.getColumnNames(), rows = [];
      while(st.step()) rows.push(st.get());
      out.push({sql:text, cols, rows, changes: cols.length || isDDL(text) ? null : db.getRowsModified()});
    }catch(e){ out.push({sql:text, error:e.message}); try{ st.free(); }catch(_){} break; }
  }
  return out;
}
/* Messaggi d'errore di SQLite tradotti (si mostra anche l'originale: è quello che si incontra nei DBMS veri) */
function itError(m){
  const R = [
    [/UNIQUE constraint failed: (.+)/, x=>`valore già presente: viola PRIMARY KEY / UNIQUE su ${x}`],
    [/FOREIGN KEY constraint failed/, ()=>`viola una FOREIGN KEY: la riga collegata non esiste, oppure altre righe dipendono da questa`],
    [/CHECK constraint failed: (.+)/, x=>`viola il vincolo CHECK (${x})`],
    [/NOT NULL constraint failed: (.+)/, x=>`manca un valore obbligatorio: ${x} è NOT NULL`],
    [/table "?([\w]+)"? already exists/, x=>`la tabella ${x} esiste già`],
    [/has more than one primary key/, ()=>`la tabella ha più di una PRIMARY KEY`],
    [/unknown column "(\w+)" in foreign key definition/, x=>`la colonna ${x} usata nella FOREIGN KEY non è stata dichiarata`],
    [/no such table: (\S+)/, x=>`la tabella ${x} non esiste`],
    [/ambiguous column name: (\S+)/, x=>`nome di colonna ambiguo: ${x} esiste in più tabelle, scrivi Tabella.${x}`],
    [/misuse of aggregate/, ()=>`funzione di aggregazione usata nel posto sbagliato (nel WHERE? usa HAVING)`],
    [/no such column: (\S+)/, x=>`la colonna ${x} non esiste`],
    [/table (\w+) has (\d+) columns but (\d+) values were supplied/, (t,a,b)=>`la tabella ${t} ha ${a} colonne ma hai indicato ${b} valori`],
    [/near "(.*)": syntax error/, x=>`errore di sintassi vicino a «${x}»`],
    [/incomplete input/, ()=>`comando incompleto: manca qualcosa alla fine`]
  ];
  for(const [re, f] of R){ const m2 = String(m).match(re); if(m2) return f(...m2.slice(1)); }
  return 'errore';
}
/* Evidenziazione della sintassi SQL (solo parole chiave in MAIUSCOLO) */
const SQL_KW = new Set(('SELECT FROM WHERE AND OR NOT NULL IS IN BETWEEN LIKE ORDER BY GROUP HAVING AS ON JOIN LEFT INNER ' +
  'CREATE TABLE PRIMARY KEY FOREIGN REFERENCES UNIQUE CHECK DEFAULT INSERT INTO VALUES UPDATE SET DELETE DROP ALTER ADD ' +
  'CASCADE RESTRICT NO ACTION INTEGER INT VARCHAR DECIMAL DATE TEXT BOOLEAN COUNT SUM AVG MIN MAX DISTINCT LIMIT UPPER LOWER PRAGMA ASC DESC').split(' '));
function hl(s){
  return String(s).replace(/(--[^\n]*)|(\[[A-Z]\])|('(?:[^']|'')*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z_0-9]*)|([\s\S])/g, (m, com, blank, str, num, word, other) => {
    if(com) return `<span class="hc">${esc(com)}</span>`;
    if(blank) return `<span class="hb">${blank}</span>`;
    if(str) return `<span class="hs">${esc(str)}</span>`;
    if(num) return `<span class="hn">${num}</span>`;
    if(word) return SQL_KW.has(word) ? `<span class="hk">${word}</span>` : esc(word);
    return esc(other);
  });
}

/* ---------- Correzione delle query scritte dagli studenti ---------- */
const normVal = v => {
  if(v === null || v === undefined) return null;
  if(typeof v === 'number') return Math.round(v*100)/100;
  if(/^-?\d+(\.\d+)?$/.test(String(v).trim())) return Math.round(parseFloat(v)*100)/100;
  return String(v);
};
const rowKey = r => JSON.stringify(r.map(normVal));
function compareResults(mine, exp, ordered){
  if(mine.cols.length !== exp.cols.length) return 'cols';
  const a = mine.rows.map(rowKey), b = exp.rows.map(rowKey);
  if(a.length !== b.length) return 'count';
  if(a.join('\n') === b.join('\n')) return 'ok';
  const sa = [...a].sort().join('\n'), sb = [...b].sort().join('\n');
  if(sa === sb) return ordered ? 'order' : 'ok';
  const colsSorted = rows => rows.map(r => JSON.stringify(r.map(normVal).map(String).sort())).sort().join('\n');
  if(colsSorted(mine.rows) === colsSorted(exp.rows)) return 'colorder';
  return 'rows';
}
const stripComments = s => String(s).replace(/--[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
async function checkQuery(g, text){
  const SQL = await getSQL();
  const clean = stripComments(text).trim();
  if(!clean) return {ok:false, msg:'Scrivi prima la query.'};
  if(!/^SELECT\b/i.test(clean)) return {ok:false, msg:'La risposta deve essere una query che inizia con <b>SELECT</b>.'};
  if(clean.replace(/;\s*$/,'').includes(';')) return {ok:false, msg:'Scrivi una sola query (un solo punto e virgola, alla fine).'};
  const run = (mode, q) => { const db = makeCompanyDB(SQL, mode); const r = runStatements(db, q); db.close(); return r[r.length-1] || {error:'nessun risultato'}; };
  const mine = run('full', text), exp = run('full', g.solution);
  if(mine.error) return {ok:false, mine, exp, msg:`Il database risponde con un errore: <b>${esc(itError(mine.error))}</b> <span class="em">(${esc(mine.error)})</span>`};
  const tips = [];
  if(/=\s*NULL\b/i.test(clean)) tips.push('Per i valori mancanti si usa <b>IS NULL</b>: <code class="ic">= NULL</code> non è mai vero.');
  if(/\bOR\s+'[^']*'/i.test(clean)) tips.push('Dopo OR serve una condizione completa: <code class="ic">citta = \'Rimini\' OR citta = \'Cesena\'</code>, oppure usa IN.');
  const c = compareResults(mine, exp, g.ordered);
  const expCols = exp.cols.join(', ');
  if(c === 'cols') return {ok:false, mine, exp, msg:`Il tuo risultato ha <b>${mine.cols.length}</b> colonn${mine.cols.length===1?'a':'e'}, ne servono <b>${exp.cols.length}</b>: ${esc(expCols)}.`, tips};
  if(c === 'count') return {ok:false, mine, exp, msg:`Ottieni <b>${mine.rows.length}</b> rig${mine.rows.length===1?'a':'he'}, ne servono <b>${exp.rows.length}</b>: controlla la condizione nel WHERE${g.ordered ? ' (e il LIMIT)' : ''}.`, tips};
  if(c === 'colorder') return {ok:false, mine, exp, msg:`I dati sono giusti, ma le colonne vanno in quest’ordine: <b>${esc(expCols)}</b>.`, tips};
  if(c === 'order') return {ok:false, mine, exp, msg:'Le righe sono giuste ma <b>nell’ordine sbagliato</b>: controlla ORDER BY (ASC o DESC?).', tips};
  if(c === 'rows') return {ok:false, mine, exp, msg:'Stesso numero di righe ma con valori diversi: controlla colonne e condizione.', tips};
  /* risultato giusto sui dati visibili: prova sui dati nascosti */
  const mineH = run('hidden', text), expH = run('hidden', g.solution);
  if(mineH.error || compareResults(mineH, expH, g.ordered) !== 'ok')
    return {ok:false, mine, exp, msg:'Con questi dati il risultato è giusto, ma la query <b>non è generale</b>: provata su dati diversi sbaglia. Esprimi la condizione richiesta invece di scegliere le righe (per esempio con gli id).', tips};
  return {ok:true, mine, exp, msg:'Risultato corretto, anche sui dati nascosti!'};
}
function resultTableHTML(r, max = 12){
  if(!r || r.error || !r.cols) return '';
  if(!r.rows.length) return `<div class="tbl-wrap"><table class="tbl res"><thead><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead></table></div><div class="legend">Nessuna riga.</div>`;
  return `<div class="tbl-wrap"><table class="tbl res"><thead><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${r.rows.slice(0,max).map(row=>`<tr>${row.map(v=>`<td>${v===null ? '<span class="em">NULL</span>' : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="legend">${r.rows.length} rig${r.rows.length===1?'a':'he'}${r.rows.length>max ? ` (mostrate le prime ${max})` : ''}</div>`;
}

  }).catch(()=>{ const el = $('#expected'); if(el) el.innerHTML = '<div class="legend">Motore SQL non disponibile: serve la connessione a Internet.</div>'; });
}
async function doWriteCheck(){
  const g = state.data, W = state.write;
  if(!g || g.type !== 'write' || W.busy || W.res?.ok) return;
  W.text = $('#sqlw')?.value ?? W.text;
  W.busy = true; renderGame();
  let res;
  try{ res = await checkQuery(g, W.text); }
  catch(e){ res = {ok:false, msg:'Motore SQL non disponibile: serve la connessione a Internet.'}; }
  W.busy = false; W.res = res;
  if(res.mine || res.ok || res.exp){                    // conta solo le query davvero eseguite
    W.tries++;
    const ok = res.ok;
    if(ok){ state.checked = true; state.score = 1; }
    if(state.role==='student'){
      const d = state.student, key = g.id+'|*';
      if(state.mode==='review'){
        if(!g._recorded){ g._recorded = true; const R = state.review; R.total++; if(ok) R.right++; if(reviewRecord(d, key, ok)==='mastered') R.mastered++; }
      } else {
        const wasDone = trainingDone(d);
        if(!isSolved(g.id)){
          const r = d.games[gk(g.id)] || {attempts:0, errors:0, solved:false, items:1};
          r.attempts++; if(!ok) r.errors++;
          if(ok){ r.solved = true; r.solvedAt = nowISO(); }
          d.games[gk(g.id)] = r;
        }
        if(!ok && !W.queued){ reviewAdd(d, [key]); W.queued = true; }
        if(!wasDone && trainingDone(d)) state.trainingJustDone = true;
      }
      d.lastSeen = nowISO(); persist();
    } else if(state.role==='admin' && ok && state.mode==='practice') state.previewSolved.add(g.id);
  }
  renderGame();
}

  theory:`
    <p>Con la normalizzazione (livello 8 di DB Quest) i dati sono stati divisi in più tabelle collegate da chiavi esterne. Con <b>JOIN</b> si rimettono insieme.</p>
    <pre class="sql ex">SELECT Ordine.id_ordine, Ordine.data, Cliente.ragione_sociale
FROM Ordine
JOIN Cliente ON Ordine.id_cliente = Cliente.id_cliente;   -- FK = PK</pre>
    <ul>
      <li><b>JOIN … ON</b> abbina le righe delle due tabelle che soddisfano la condizione: quasi sempre <b>chiave esterna = chiave primaria</b>.</li>
      <li>Se una colonna esiste in entrambe le tabelle va scritta come <b>Tabella.colonna</b>; altrimenti il database segnala un nome <i>ambiguo</i>.</li>

function courseSummary(id, d){
  const c = COURSES[id], games = c.levels.flatMap(l => l.games), total = games.length;

let backend = null;

async function makeFirebaseBackend(cfg){
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
  const [{initializeApp}, A, F] = await Promise.all([
    import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')
  ]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const map = u => u ? {uid:u.uid, email:u.email, name:u.displayName||u.email, photo:u.photoURL||null} : null;
  return {
    mode:'firebase',
    onAuth(cb){ A.onAuthStateChanged(auth, u => cb(map(u))); },
    async signIn(){
      const p = new A.GoogleAuthProvider();
      p.setCustomParameters(CONFIG.ALLOWED_DOMAIN ? {prompt:'select_account', hd:CONFIG.ALLOWED_DOMAIN} : {prompt:'select_account'});
      try{ await A.signInWithPopup(auth,p); }
      catch(e){ if(String(e.code).includes('popup-blocked')) await A.signInWithRedirect(auth,p); else throw e; }
    },
    async signOut(){ await A.signOut(auth); },
    async load(coll,uid){ const s = await F.getDoc(F.doc(db,coll,uid)); return s.exists() ? s.data() : null; },
    async save(coll,uid,data){ await F.setDoc(F.doc(db,coll,uid), data); },
    /* aggiorna solo i campi indicati (ognuno sostituito per intero); examEnd → ora del server */
    async patch(coll,uid,data,opts={}){
      const d = {...data};
      if(opts.examEnd) d.lastExamEnd = F.serverTimestamp();
      await F.setDoc(F.doc(db,coll,uid), d, {mergeFields: Object.keys(d)});
    },
    async list(coll){ const q = await F.getDocs(F.collection(db,coll)); return q.docs.map(d=>({uid:d.id, ...d.data()})); },
    async remove(coll,uid){ await F.deleteDoc(F.doc(db,coll,uid)); },
    async getConfig(){ const s = await F.getDoc(F.doc(db,'config','settings')); return s.exists() ? s.data() : null; },
    async call(name, data){
      const Fn = await import(base+'firebase-functions.js');
      const r = await Fn.httpsCallable(Fn.getFunctions(app, CONFIG.FUNCTIONS_REGION), name, {timeout:60000})(data);
      return r.data;
    },
    async saveConfig(c){ await F.setDoc(F.doc(db,'config','settings'), c); }
  };
}

function makeLocalBackend(){
  const SES='dbquest.demo.session', KEY = coll => coll==='students' ? 'dbquest.demo.db' : 'dbquest.demo.db.'+coll;
  const rd = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
  const wr = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  let cb = ()=>{};
  return {
    mode:'demo',
    onAuth(f){ cb=f; f(rd(SES)); },
    async signIn({name,email}={}){
      const e = String(email||'').trim().toLowerCase();
      if(!/^\S+@\S+\.\S+$/.test(e)) throw new Error('Inserisci un’email valida.');
      const u = {uid:'demo_'+e.replace(/[^a-z0-9]/g,'_'), email:e, name:String(name||'').trim()||e.split('@')[0], photo:null};
      wr(SES,u); cb(u);
    },
    async signOut(){ wr(SES,null); cb(null); },
    async load(coll,uid){ return (rd(KEY(coll))||{})[uid] || null; },
    async save(coll,uid,data){ const db=rd(KEY(coll))||{}; db[uid]=data; wr(KEY(coll),db); },
    async patch(coll,uid,data,opts={}){
      const db=rd(KEY(coll))||{}; db[uid] = {...(db[uid]||{}), ...data};
      if(opts.examEnd) db[uid].lastExamEnd = new Date().toISOString();
      wr(KEY(coll),db);
    },
    async list(coll){ return Object.entries(rd(KEY(coll))||{}).map(([uid,d])=>({uid,...d})); },
    async remove(coll,uid){ const db=rd(KEY(coll))||{}; delete db[uid]; wr(KEY(coll),db); },
    async getConfig(){ return rd('dbquest.demo.config'); },
    async saveConfig(c){ wr('dbquest.demo.config', c); }
  };
}

function authError(e){
  const c = String(e?.code||'');
  if(c.includes('popup-closed') || c.includes('cancelled-popup')) return '';
  if(c.includes('unauthorized-domain')) return 'Dominio non autorizzato: aggiungi questo indirizzo in Firebase → Authentication → Settings → Authorized domains.';
  if(c.includes('operation-not-allowed')) return 'Accesso con Google non abilitato: Firebase → Authentication → Sign-in method → Google.';
  if(c.includes('network')) return 'Connessione assente: riprova.';
  return 'Accesso non riuscito: ' + (e?.message || e);
}

let saveChain = Promise.resolve();
function persist(opts = {}){
  if(state.role!=='student' || !state.student) return;
  const uid = state.user.uid, coll = COURSE.coll, snap = JSON.parse(JSON.stringify(state.student));
  /* i campi del docente (attestato, tentativi concessi, convalide…) non si riscrivono mai dal browser dello studente */
  const guarded = backend.mode === 'firebase' && (state.serverGrading || needsValidation());
  if(guarded) ADMIN_FIELDS.forEach(k => delete snap[k]); else delete snap.lastExamEnd;
  saveChain = saveChain.then(()=>backend.patch(coll, uid, snap, opts))
    .catch(err=>{
      console.error(err);
      if(String(err?.code||'').includes('permission-denied')){
        toast('⚠ I tuoi dati sono stati aggiornati dal docente: li ricarico.');
        backend.load(coll, uid).then(d => {
          if(!d || COURSE.coll !== coll) return;
          state.student = state.docs[COURSE.id] = migrateDoc(d);
          if(['home','examIntro','courses','reviewEnd'].includes(state.screen)) render();
        }).catch(e => console.error(e));
      } else toast('⚠ Salvataggio non riuscito: controlla la connessione e ricarica la pagina.');
    });
}

function isSolved(id){
  if(state.role==='admin') return state.previewSolved.has(id);
  return !!state.student?.games?.[gk(id)]?.solved;
}
function levelProgress(lv){ return lv.games.filter(g=>isSolved(g.id)).length; }
function isLevelUnlocked(i){
  if(i===0 || (state.role==='admin' && state.unlockAll)) return true;
  const prev = LEVELS[i-1];
  return levelProgress(prev) === prev.games.length;
}

/* ---------- GAME ---------- */
function normalize(game){
  if(game.type === 'write') return {...game, items:[], buckets:[]};
  if(game.type === 'order'){
    const buckets = game.items.map((_,i)=>({id:'o'+(i+1), label:(i+1)+'°', cap:1}));
    const items   = game.items.map((label,i)=>({id:'i'+(i+1), label, answer:'o'+(i+1)}));
    return { ...game, buckets, items: shuffle(items) };
  }
  return { ...game, items: sampleItems(game) };
}
/* Sorteggia 'show' elementi dal pool, con almeno un elemento per contenitore (finché ce ne sono) */
function sampleItems(game){
  const n = Math.min(game.show || game.items.length, game.items.length);
  const pool = shuffle(game.items);
  if(n === pool.length) return pool;
  const pick = [];
  for(const b of shuffle(game.buckets)){
    const i = pool.findIndex(it => it.answer === b.id);
    if(i >= 0 && pick.length < n) pick.push(pool.splice(i,1)[0]);
  }
  while(pick.length < n) pick.push(pool.shift());
  return shuffle(pick);
}

function setData(data){
  state.data = data;
  state.loc = {};
  data.items.forEach(it => state.loc[it.id] = 'pool');
  state.selected = null; state.checked = false; state.score = 0;
  state.write = {text:data.starter || '', res:null, tries:0, showHint:false, showSol:false, busy:false, expected:null, queued:false};
  state.screen = 'game';
  render();
}
function loadGame(){
  state.mode = 'practice';
  setData(normalize(LEVELS[state.level].games[state.game]));
}

const itemsIn = zoneId => state.data.items.filter(it => state.loc[it.id] === zoneId);

function itemHTML(it){
  const cls = ['item'];
  if(state.selected === it.id) cls.push('selected');
  if(state.checked) cls.push(state.loc[it.id] === it.answer ? 'correct' : 'wrong');
  if(state.data.code) cls.push('code');
  return `<div class="${cls.join(' ')}" draggable="true" data-id="${it.id}">${state.data.code ? hl(it.label) : esc(it.label)}</div>`;
}
function zoneHTML(b){
  return `<div class="zone" data-zone="${b.id}">
    <div class="zone-title">${esc(b.label)}</div>
    <div class="zone-body">${itemsIn(b.id).map(itemHTML).join('')}</div>
  </div>`;
}

function feedbackHTML(){
  const g = state.data, isOrder = g.type==='order';
  const lbl = id => g.buckets.find(b=>b.id===id)?.label || '';
  const wrong = g.items.filter(it => state.loc[it.id] !== it.answer);
  const line = it => `<li><b>${labelHTML(it, g)}</b> → ${isOrder ? `va al <b>${esc(lbl(it.answer))}</b> posto` : `va in <b>${esc(lbl(it.answer))}</b>`}${it.why ? `<span>${esc(it.why)}</span>` : ''}</li>`;
  const expl = g.explain ? `<p>📌 ${esc(g.explain)}</p>` : '';
  if(wrong.length) return `<div class="fb"><div class="fb-h">💡 Perché no</div><ul>${wrong.map(line).join('')}</ul>${expl}</div>`;
  if(isOrder) return expl ? `<details class="fb"><summary>💡 Perché quest’ordine</summary>${expl}</details>` : '';
  return `<details class="fb"><summary>💡 Rivedi le spiegazioni</summary><ul>${g.items.map(line).join('')}</ul></details>`;
}

      : isSolved(g.id) ? `<span class="pill">📖 Ripasso libero</span>` : `<span class="pill">🏋️ Allenamento · non conta per il voto</span>`;

      msg = `Trascina ogni elemento nel contenitore corretto.<br><span class="legend">Nessuna spiegazione durante la verifica: risposte corrette e spiegazioni le vedi alla fine. Dopo la conferma non si torna indietro.</span>`;

      ${allPlaced ? '' : '<div class="legend">Posiziona tutti gli elementi per continuare. Su touch: tocca un elemento, poi il contenitore.</div>'}`;
  } else {
    const ok = state.score === total;
    let msg = ok ? `<span class="ok">✔ Perfetto! ${state.score}/${total}</span>`
                 : `<span class="ko">✘ ${state.score}/${total} corrette</span> — gli elementi rossi sono nel posto sbagliato.`;
    let btns;
    if(mode==='review'){
      if(!ok) msg += ' Leggi la spiegazione: questi elementi torneranno nei prossimi giorni.';

}

/* Convalida: il browser del docente ricorregge ogni verifica consegnata e non ancora convalidata,
   a partire dalle domande e dalle risposte salvate (il punteggio dichiarato dallo studente non conta) */
async function validatePending(rows){
  if(!COURSE.examEnabled) return;
  let nOk = 0, nBad = 0;
  for(const d of rows){
    const todo = (d.examAttempts || []).filter(t => attemptView(d, t).pending);
    if(!todo.length) continue;
    const validations = {...(d.validations || {})}; let passed = d.passed || null;
    for(const t of todo){
      const ex = {games: t.games, answers: t.answers || {}}, bad = examStructureError(ex);
      const sc = bad ? {correct:0, total:EXAM_ITEMS, percent:0, wrong:[]} : await scoreExam(ex);
      const ok = !bad && sc.percent >= CONFIG.PASS_THRESHOLD;
      const mismatch = !!bad || sc.correct !== t.correct || sc.total !== t.total;
      validations[t.n] = {at:nowISO(), correct:sc.correct, total:sc.total, percent:sc.percent, passed:ok, wrong:sc.wrong,
                          claimed:t.percent ?? null, mismatch, invalid:bad || null};
      if(ok && !passed) passed = {percent:sc.percent, correct:sc.correct, total:sc.total, at:t.completedAt, attempt:t.n,
                                  code:makeCode(d.uid + '|' + t.completedAt), validatedAt:nowISO()};
      if(mismatch) nBad++; else nOk++;
    }
    const upd = {validations}; if(passed !== (d.passed || null)) upd.passed = passed;
    try{ await backend.patch(COURSE.coll, d.uid, upd); Object.assign(d, upd); }
    catch(e){ console.error(e); toast('⚠ Convalida non salvata: controlla le regole di Firestore.'); return; }
  }
  if(nOk || nBad) toast(`✔ Convalidate ${nOk + nBad} verifiche${nBad ? ` — ⚠️ ${nBad} con punteggio dichiarato diverso da quello ricalcolato` : ''}`);
}
const flagged = d => Object.values(d.validations || {}).some(v => v.mismatch);

const SORTERS = {
  name:r=>(r.d.name||'').toLowerCase(), solved:r=>r.s.solved, errors:r=>r.s.errors, review:r=>r.rv.total,
  exam:r=>examScore(r) ?? -1, status:r=>['nuovo','in_corso','verifica','non_superato','superato'].indexOf(r.status),
  lastSeen:r=>r.d.lastSeen||'', classe:r=>r.d.classe||'~', dl:r=>r.dl ? (r.dl.late ? 0 : r.dl.allDone ? 2 : 1) : 3
};

function deadlinesFor(classe, courseId = COURSE.id){

    .filter(x => x.course === courseId && (x.classe === '*' || (classe && x.classe === classe)))
    .sort((a,b) => a.due.localeCompare(b.due));

/* Stato di una scadenza per uno studente: completata? in ritardo? quanti giochi mancano? */
function dlStatus(dl, d, courseId = COURSE.id){
  const c = COURSES[courseId], exam = dl.upto === 'exam';
  const games = exam ? [] : c.levels.filter(l => l.id <= dl.upto).flatMap(l => l.games);
  const end = new Date(dl.due + 'T23:59:59').getTime(), now = Date.now();
  let done, missing, doneAt = null;
  if(exam){
    const t = (d?.examAttempts || [])[0];
    done = !!t || !!d?.passed; missing = done ? 0 : 1;
    doneAt = t ? t.completedAt : (d?.passed?.at || null);
  } else {
    const solved = games.filter(g => d?.games?.[gk(g.id)]?.solved);
    done = solved.length === games.length; missing = games.length - solved.length;
    if(done) doneAt = solved.map(g => d.games[gk(g.id)].solvedAt || '').sort().pop() || null;
  }
  return {done, missing, total: exam ? 1 : games.length, late: !done && now > end,
          doneLate: !!(done && doneAt && new Date(doneAt).getTime() > end),
          daysLeft: Math.round((new Date(dl.due + 'T00:00:00') - new Date(new Date().toDateString())) / DAY)};
}
function dlSummary(d, courseId = COURSE.id){
  const items = deadlinesFor(d?.classe, courseId).map(dl => ({dl, st: dlStatus(dl, d, courseId)}));
  return {items, late: items.some(i => i.st.late), allDone: items.length > 0 && items.every(i => i.st.done)};
}
function deadlineBanners(d){

    if(st.late) return `<div class="banner ko"><div class="grow">⏰ <b>Scadenza superata</b> il ${fmtDate(dl.due)}: dovevi ${what}.
        ${dl.upto === 'exam' ? '' : `Ti mancano <b>${st.missing}</b> giochi su ${st.total}.`} Recupera il prima possibile.</div></div>`;
    const when = st.daysLeft <= 0 ? '<b>oggi</b>' : st.daysLeft === 1 ? '<b>domani</b>' : `tra ${st.daysLeft} giorni`;

function exportCSV(){
  const head = ['Nome','Email','Classe','Allenamento','Errori allenamento','Ripasso in programma','Elementi consolidati','Tentativi verifica','Verifica %','Stato','Codice certificato','Data superamento','Ultima attività'];
  const lines = state.admin.rows.filter(d => !state.admin.classe || (state.admin.classe === '—' ? !d.classe : d.classe === state.admin.classe)).map(d=>{
    const s = computeStats(d), e = examInfo(d), rv = reviewInfo(d), st = statusOf(d);
    const pct = d.passed ? d.passed.percent : e.best;
    return [d.name, d.email, d.classe||'', `${s.solved}/${TOTAL}`, s.errors, rv.total, d.reviewMastered||0, `${e.used}/${examAllowed(d)}`,
            pct==null?'':String(pct).replace('.',','), STATUS_LABEL[st], d.passed?.code||'', d.passed?fmtDT(d.passed.at):'', fmtDT(d.lastSeen)];
  });
  const csv = [head,...lines].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href=url; a.download=`dbquest-studenti-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

const labKey = () => 'dbquest.lab.' + (state.user?.uid || 'anon');
function labSave(){
  try{
    const bytes = state.lab.db.export();
    state.lab.db.run('PRAGMA foreign_keys = ON;');           // export() riapre il database e azzera le PRAGMA
    let bin = '';
    for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
    localStorage.setItem(labKey(), btoa(bin));
  }catch(e){}
}
function labLoad(SQL){
  try{
    const b64 = localStorage.getItem(labKey()); if(!b64) return null;
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const db = new SQL.Database(u); db.run('PRAGMA foreign_keys = ON;'); return db;
  }catch(e){ return null; }
}
