function moveItem(itemId, zoneId){
  if(state.checked || !itemId || !(itemId in state.loc)) return;
  const bucket = state.data.buckets.find(b => b.id === zoneId);
  if(bucket && bucket.cap){
    const occ = Object.entries(state.loc).filter(([id,z]) => z === zoneId && id !== itemId);
    if(occ.length >= bucket.cap) state.loc[occ[0][0]] = state.loc[itemId];   // scambio con lo slot di partenza
  }
  state.loc[itemId] = zoneId;
  state.selected = null;
  renderGame();
}

function doCheck(){
  const g = state.data, total = g.items.length;
  if(g.type==='write' || state.mode==='exam' || state.checked || g.items.some(it=>state.loc[it.id]==='pool')) return;
  state.checked = true;
  state.score = g.items.filter(it => state.loc[it.id] === it.answer).length;
  const wrongItems = g.items.filter(it => state.loc[it.id] !== it.answer), wrong = wrongItems.length;

  if(state.role==='student'){
    const d = state.student;
    if(state.mode==='review'){
      if(!g._recorded){                       // conta solo il primo tentativo di ogni schermata
        g._recorded = true;
        const R = state.review;
        const cards = g.type==='order' ? [[g.id+'|*', wrong===0]] : g.items.map(it => [g.id+'|'+it.id, state.loc[it.id]===it.answer]);
        for(const [k, ok] of cards){ R.total++; if(ok) R.right++; if(reviewRecord(d, k, ok)==='mastered') R.mastered++; }
        d.lastSeen = nowISO(); persist();
      }
    } else {
      const key = gk(g.id), wasDone = trainingDone(d);
      if(!isSolved(g.id)){                    // statistiche di allenamento fino alla prima soluzione
        const r = d.games[key] || {attempts:0, errors:0, solved:false, items:total};
        r.attempts++; r.errors += wrong; r.items = total;
        if(wrong === 0){ r.solved = true; r.solvedAt = nowISO(); }
        d.games[key] = r;
      }
      if(wrong) reviewAdd(d, g.type==='order' ? [g.id+'|*'] : wrongItems.map(it => g.id+'|'+it.id));
      if(!wasDone && trainingDone(d)) state.trainingJustDone = true;
      d.lastSeen = nowISO();
      persist();
    }
  } else if(state.role==='admin' && wrong===0 && state.mode==='practice'){
    state.previewSolved.add(g.id);
  }
  renderGame();
}

function doRetry(){
  state.data.items.forEach(it => state.loc[it.id] = 'pool');
  state.data.items = shuffle(state.data.items);
  state.checked = false; state.score = 0; state.selected = null;
  renderGame();
}

function doNext(){
  if(state.trainingJustDone){
    state.trainingJustDone = false; toast('🎯 Allenamento completato: verifica finale sbloccata!');
    state.screen = 'examIntro'; render(); return;
  }
  const lv = LEVELS[state.level];
  if(state.game + 1 < lv.games.length){ state.game++; loadGame(); return; }
  if(state.level + 1 < LEVELS.length && isLevelUnlocked(state.level+1)){
    state.level++; state.game = 0; toast(`🔓 Livello ${LEVELS[state.level].id} sbloccato!`);
    ACTIONS.openLevel({level:String(state.level)}); return;
  }
  state.screen = 'home'; render();
}

/* ---- Verifica finale ---- */
function loadExamStep(){
  const ex = state.exam;
  if(ex.step >= ex.games.length){ finishExam(); return; }
  state.mode = 'exam';
  setData(examGameData(ex.games[ex.step]));
}
async function reloadStudent(){
  await saveChain;
  const d = await backend.load(COURSE.coll, state.user.uid);
  if(d){ state.student = state.docs[COURSE.id] = migrateDoc(d); }
}
async function finishExam(){
  const ex = state.exam;
  state.screen = 'loading'; render();
  if(state.role === 'student' && state.serverGrading){     /* correzione e registrazione fatte dal server */
    try{
      await saveChain;
      const r = await backend.call('submitExam', {course: COURSE.id, answers: ex.answers});
      await reloadStudent();
      state.examResult = {...r, exam: ex};
      state.exam = null; state.mode = 'practice'; state.screen = 'examResult'; render();
    }catch(err){
      console.error(err); ex.step = ex.games.length - 1;
      toast('⚠ Consegna non riuscita: ' + (err.message || err) + ' — riprova.');
      loadExamStep();
    }
    return;
  }
  const sc = await scoreExam(ex), passed = sc.percent >= CONFIG.PASS_THRESHOLD, at = nowISO();
  let provisional = false;
  if(state.role==='student'){
    const d = state.student, n = d.examAttempts.length + 1, val = needsValidation();
    /* si salvano domande e risposte: il docente potrà ricorreggere la verifica */
    const t = {n, startedAt:ex.startedAt, completedAt:at, completedMs:Date.now(), correct:sc.correct, total:sc.total, percent:sc.percent, passed,
               wrong:sc.wrong, items:sc.all, games:ex.games, answers:ex.answers,
               queries:Object.fromEntries(ex.games.filter(g=>g.write).map(g=>[g.id, (ex.answers[g.id]||{}).sql || '']))};
    if(!val) t.auto = true;
    d.examAttempts.push(t);
    if(passed && !val) d.passed = {percent:sc.percent, correct:sc.correct, total:sc.total, at, attempt:n, code:makeCode(state.user.uid+'|'+at)};
    provisional = val;
    reviewAdd(d, sc.wrong);
    d.exam = null; d.lastSeen = at; d.lastExamEnd = at;
    persist({examEnd:true});
  }
  state.examResult = {...sc, passed, provisional, at, exam:ex};
  state.exam = null; state.mode = 'practice';
  state.screen = 'examResult'; render();
}

/* ---- Ripasso ---- */
function loadReviewStep(){
  const R = state.review;
  if(R.idx >= R.groups.length){ state.mode = 'practice'; state.screen = 'reviewEnd'; render(); return; }
  const grp = R.groups[R.idx], g = gameById(grp.gid);
  state.mode = 'review';
  setData(grp.whole ? normalize(g) : {...g, items: shuffle(grp.items.map(iid => g.items.find(it => it.id === iid)))});
}

/* =========================================================================
   7) AZIONI (click delegati)
   ========================================================================= */
async function adminUpdate(uid, fn, okMsg){
  const d = state.admin.rows.find(r=>r.uid===uid); if(!d) return;
  const copy = JSON.parse(JSON.stringify(d)); delete copy.uid;
  const before = JSON.parse(JSON.stringify(d)), after = fn(copy), upd = {};
  /* si scrivono solo i campi cambiati: niente sovrascritture di ciò che lo studente sta salvando */
  for(const k of new Set([...Object.keys(before), ...Object.keys(after)])){
    if(k === 'uid') continue;
    if(!(k in after)) upd[k] = null;
    else if(JSON.stringify(after[k]) !== JSON.stringify(before[k])) upd[k] = after[k];
  }
  try{ if(Object.keys(upd).length) await backend.patch(COURSE.coll, uid, upd); await loadAdminRows(); render(); toast(okMsg); }
  catch(e){ console.error(e); toast('⚠ Operazione non riuscita'); }
}
const ACTIONS = {
  async login(){
    state.loginError = '';
    try{ await backend.signIn(); }
    catch(e){ state.loginError = authError(e); render(); }
  },
  async logout(){
    state.admin.detail = null;
    if(state.lab?.db){ try{ state.lab.db.close(); }catch(e){} }
    state.lab = null; state.docs = {}; state.student = null; state.classe = null; state.admin.classe = '';
    await backend.signOut();
  },
  courses(){
    if(state.role==='student' && state.student) state.docs[COURSE.id] = state.student;
    state.admin.detail = null; state.screen = 'courses'; render();
  },
  async chooseCourse(ds){
    if(state.role==='student' && state.student) state.docs[COURSE.id] = state.student;
    setCourse(ds.id);
    if(state.role==='admin'){ state.admin.detail = null; state.admin.rows = []; state.screen = 'admin'; render(); await loadAdminRows(); render(); return; }
    const u = state.user, d = migrateDoc(state.docs[ds.id] || newStudent(u));
    if(!d.classe && state.classe) d.classe = state.classe;
    Object.assign(d, {name:u.name, email:u.email, photo:u.photo||d.photo||null, lastSeen:nowISO()});
    state.student = state.docs[ds.id] = d; persist();
    state.screen = 'home'; render();
  },
  previewCourse(ds){ setCourse(ds.id); state.screen = 'home'; render(); },
  lab(){ openLab(); },
  labFrom(){ openLab(state.data.items.map(it => (it.sql || it.label).replace(/;?\s*$/, ';')).join('\n')); },
  labBack(){ state.screen = state.labBack==='game' && state.data ? 'game' : 'home'; render(); },
  writeCheck(){ doWriteCheck(); },
  writeHint(){ state.write.text = $('#sqlw')?.value ?? state.write.text; state.write.showHint = true; renderGame(); },
  writeSolution(){ state.write.text = $('#sqlw')?.value ?? state.write.text; state.write.showSol = true; renderGame(); },
  labRun(){
    const L = state.lab; if(!L?.db) return;
    L.text = $('#sqlin').value;
    if(!L.text.trim()) return;
    L.out = runStatements(L.db, L.text); labSave(); render();
  },
  labEx(ds){ state.lab.text = LAB_EXAMPLES[+ds.i][1]; render(); $('#sqlin')?.focus(); },
  async labReset(ds){
    const full = ds.mode==='data';
    if(!confirm(full ? 'Ripristinare il database dell’azienda con i dati iniziali? Le modifiche fatte nel laboratorio andranno perse.'
                     : 'Ricreare le tabelle dell’azienda vuote? Le modifiche fatte nel laboratorio andranno perse.')) return;
    try{
      const SQL = await getSQL();
      try{ state.lab.db?.close(); }catch(e){}
      state.lab.db = makeCompanyDB(SQL, full ? 'full' : 'schema'); state.lab.out = []; labSave(); render(); toast('Database ripristinato');
    }catch(e){ toast('⚠ Motore SQL non disponibile'); }
  },
  openLevel(ds){
    const i = +ds.level; if(!isLevelUnlocked(i)) { toast('🔒 Completa prima il livello precedente.'); return; }
    state.level = i;
    const first = LEVELS[i].games.findIndex(g=>!isSolved(g.id));
    state.game = first < 0 ? 0 : first;
    const started = LEVELS[i].games.some(g => state.role==='student' ? state.student.games[gk(g.id)] : isSolved(g.id));
    const tkey = state.course + ':' + i;
    if(!started && !state.seenTheory.has(tkey)){
      state.seenTheory.add(tkey); state.theory = {level:i, ret:'start'}; state.screen = 'theory'; render(); return;
    }
    loadGame();
  },
  startLevel(){ loadGame(); },
  theory(){ state.theory = {level:state.level, ret:'game'}; state.screen = 'theory'; render(); },
  backToGame(){ state.screen = 'game'; renderGame(); },
  home(){ state.mode = 'practice'; state.screen = 'home'; render(); },
  check: doCheck, retry: doRetry, next: doNext,
  toggleUnlock(){ state.unlockAll=!state.unlockAll; render(); },
  resetPreview(){ state.previewSolved=new Set(); state.exam=null; render(); },
  preview(){ state.screen='home'; render(); },
  async adminPanel(){ state.screen='admin'; render(); await loadAdminRows(); render(); },

  examIntro(){
    if(!COURSE.examEnabled){ toast('🚧 La verifica finale di questo corso arriverà con i prossimi livelli.'); return; }
    if(state.role==='student' && examInfo(state.student).st==='locked'){ toast('🔒 Completa prima tutti i giochi dell’allenamento.'); return; }
    state.screen = 'examIntro'; render();
  },
  async startExam(){
    if(state.role==='admin'){ state.exam = state.exam || buildExam(); loadExamStep(); return; }
    const d = state.student, e = examInfo(d);
    if(state.serverGrading){                       /* le domande le sorteggia e le salva il server */
      if(e.st==='ready' && !confirm(`Iniziare la verifica finale?\nIl tentativo viene conteggiato da subito (tentativi rimasti: ${e.left}).`)) return;
      if(e.st!=='ready' && e.st!=='running') return;
      state.screen = 'loading'; render();
      try{
        const r = await backend.call('startExam', {course: COURSE.id});
        await reloadStudent();
        const dr = state.student.examDraft && state.student.examDraft.startedAt === r.exam.startedAt ? state.student.examDraft : null;
        state.exam = {...r.exam, step: dr ? dr.step : 0, answers: dr ? dr.answers : {}};
        loadExamStep();
      }catch(err){ console.error(err); toast('⚠ ' + (err.message || err)); state.screen = 'home'; render(); }
      return;
    }
    if(e.st==='ready'){
      if(!confirm(`Iniziare la verifica finale?\nIl tentativo viene conteggiato da subito (tentativi rimasti: ${e.left}).`)) return;
      d.exam = buildExam(); persist();
    } else if(e.st!=='running') return;
    state.exam = d.exam; loadExamStep();
  },
  examConfirm(){
    const g = state.data, ex = state.exam;
    if(g.type === 'write'){
      const sql = ($('#sqlw')?.value ?? state.write.text).trim();
      if(!sql && !confirm('Non hai scritto nessuna query: passare comunque alla schermata successiva? Questa domanda varrà 0 punti.')) return;
    } else if(g.items.some(it=>state.loc[it.id]==='pool')) return;
    const last = ex.step === ex.games.length-1;
    if(last && !confirm('Consegnare la verifica? Dopo la consegna vedrai il punteggio e le risposte corrette.')) return;
    ex.answers[g.id] = g.type === 'write' ? {sql: ($('#sqlw')?.value ?? state.write.text)}
                                          : Object.fromEntries(g.items.map(it => [it.id, state.loc[it.id]]));
    ex.step++;
    if(state.role==='student'){
      if(state.serverGrading) state.student.examDraft = {startedAt: ex.startedAt, step: ex.step, answers: ex.answers};
      persist();
    }
    loadExamStep();
  },

  startReview(){
    if(state.role!=='student') return;
    const R = buildReviewSession(state.student);
    if(!R.groups.length){ toast('Niente da ripassare oggi 🎉'); return; }
    state.review = R; loadReviewStep();
  },
  reviewNext(){ state.review.idx++; loadReviewStep(); },

  myCert(){ state.certFor = certData(state.student); state.certBack='home'; state.screen='cert'; render(); },
  studentCert(ds){
    const d = state.admin.rows.find(r=>r.uid===ds.uid); if(!d) return;
    state.certFor = certData(d); state.certBack='admin'; state.screen='cert'; render();
  },
  printCert(){ window.print(); },
  closeCert(){ state.screen = state.certBack; render(); },
  async refresh(){ await loadAdminRows(); render(); toast('Elenco aggiornato'); },
  csv: exportCSV,
  sort(ds){ const A=state.admin; if(A.sort===ds.key) A.dir*=-1; else { A.sort=ds.key; A.dir=1; } render(); },
  detail(ds){ state.admin.detail = ds.uid; render(); },
  closeModal(){ state.admin.detail = null; render(); },
  async grantAttempt(ds){
    const d = state.admin.rows.find(r=>r.uid===ds.uid); if(!d) return;
    if(!confirm(`Concedere a ${d.name} un tentativo in più della verifica finale, utilizzabile subito?`)) return;
    await adminUpdate(ds.uid, c => { c.extraAttempts = (c.extraAttempts||0) + 1; c.cooldownResetAt = nowISO(); c.lastExamEnd = null; return c; }, 'Tentativo concesso');
  },
  async resetStudent(ds){
    const d = state.admin.rows.find(r=>r.uid===ds.uid); if(!d) return;
    if(!confirm(`Azzerare tutti i progressi di ${d.name}?\nAllenamento, ripasso, tentativi di verifica${d.passed?' e certificato':''} ripartono da zero; nello storico resta un riepilogo.`)) return;
    await adminUpdate(ds.uid, c => {
      c.history = [...(c.history||[]), {type:'reset', at:nowISO(), solved:computeStats(c).solved,
        exams:(c.examAttempts||[]).map(t=>attemptView(c, t)).map(t=>({n:t.n, percent:t.percent, passed:t.passed, at:t.completedAt})),
        passed:c.passed ? {percent:c.passed.percent, at:c.passed.at, code:c.passed.code} : null}];
      Object.assign(c, {games:{}, review:{}, reviewMastered:0, exam:null, examDraft:null, examAttempts:[], extraAttempts:0, passed:null, cooldownResetAt:null, validations:{}, lastExamEnd:null});
      ['status','percent','certCode','completedAt','courseAttempt'].forEach(k => delete c[k]);
      return c;
    }, 'Progressi azzerati');
  },
  async deleteStudent(ds){
    const d = state.admin.rows.find(r=>r.uid===ds.uid); if(!d) return;
    if(!confirm(`Eliminare definitivamente ${d.name} e tutti i suoi dati (storico e certificato compresi)?`)) return;
    try{ await backend.remove(COURSE.coll, ds.uid); state.admin.detail=null; await loadAdminRows(); render(); toast('Studente eliminato'); }
    catch(e){ console.error(e); toast('⚠ Operazione non riuscita'); }
  }
};

async function demoLogin(){
  state.loginError = '';
  try{ await backend.signIn({name:$('#dname').value, email:$('#demail').value}); }
  catch(err){ state.loginError = err.message; render(); }
}
ACTIONS.demoLogin = demoLogin;
document.addEventListener('submit', e => { if(e.target.id === 'demoForm'){ e.preventDefault(); demoLogin(); } });
Object.assign(ACTIONS, CLASS_ACTIONS);
document.addEventListener('change', e=>{
  if(e.target.id === 'classFilter'){ state.admin.classe = e.target.value; render(); }
  if(e.target.id === 'stuClass') setStudentClass(e.target.dataset.uid, e.target.value);
});
document.addEventListener('input', e=>{
  if(e.target.id === 'q'){ state.admin.q = e.target.value; applySearch(); }
  if(e.target.id === 'sqlin' && state.lab) state.lab.text = e.target.value;
  if(e.target.id === 'sqlw' && state.write) state.write.text = e.target.value;
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.admin.detail && state.screen==='admin'){ ACTIONS.closeModal(); }
  if(e.key==='Enter' && (e.target.id==='dname' || e.target.id==='demail')){ e.preventDefault(); demoLogin(); }
  if(e.key==='Enter' && (e.ctrlKey || e.metaKey) && e.target.id==='sqlin'){ e.preventDefault(); ACTIONS.labRun(); }
  if(e.key==='Enter' && (e.ctrlKey || e.metaKey) && e.target.id==='sqlw'){ e.preventDefault(); doWriteCheck(); }
  if(e.key==='Tab' && (e.target.id==='sqlin' || e.target.id==='sqlw')){ e.preventDefault(); document.execCommand?.('insertText', false, '  '); }
});

/* =========================================================================
   8) DRAG & DROP + FALLBACK TAP
   ========================================================================= */
document.addEventListener('dragstart', e=>{
  const it = e.target.closest?.('.item');
  if(!it || state.checked) { e.preventDefault(); return; }
  e.dataTransfer.setData('text/plain', it.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  it.classList.add('dragging');
});
document.addEventListener('dragend', e=>{
  const it = e.target.closest?.('.item');
  if(it) it.classList.remove('dragging');
  document.querySelectorAll('.zone.over').forEach(z=>z.classList.remove('over'));
});
document.addEventListener('dragover', e=>{
  const z = e.target.closest?.('.zone');
  if(!z) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  z.classList.add('over');
});
document.addEventListener('dragleave', e=>{
  const z = e.target.closest?.('.zone');
  if(z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', e=>{
  const z = e.target.closest?.('.zone');
  if(!z) return;
  e.preventDefault();
  z.classList.remove('over');
  moveItem(e.dataTransfer.getData('text/plain'), z.dataset.zone);
});

document.addEventListener('click', e=>{
  // 1) bottoni/azioni
  const act = e.target.closest('[data-act]');
  if(act){
    // click dentro la modale non la chiude
    if(act.dataset.act==='closeModal' && act.classList.contains('modal-bg') && e.target.closest('[data-stop]')) return;
    if(act.disabled) return;
    ACTIONS[act.dataset.act]?.(act.dataset, e);
    return;
  }
  // 2) tap-to-move (touch / click)
  if(state.checked || state.screen !== 'game') return;
  const item = e.target.closest('.item');
  const zone = e.target.closest('.zone');
  if(item){
    const id = item.dataset.id;
    if(state.selected && state.selected !== id){
      moveItem(state.selected, state.loc[id]);
      return;
    }
    state.selected = (state.selected === id) ? null : id;
    renderGame();
    return;
  }
  if(zone && state.selected) moveItem(state.selected, zone.dataset.zone);
});

/* =========================================================================
   9) AUTENTICAZIONE E AVVIO
   ========================================================================= */
async function handleAuth(user){
  if(!user){
    Object.assign(state,{user:null, role:null, student:null, screen:'login'});
    render(); return;
  }
  const admin = isAdminEmail(user.email);
  if(!admin && CONFIG.ALLOWED_DOMAIN && !String(user.email).toLowerCase().endsWith('@'+CONFIG.ALLOWED_DOMAIN.toLowerCase())){
    state.loginError = `Accedi con l’account della scuola (@${CONFIG.ALLOWED_DOMAIN}).`;
    await backend.signOut(); return;
  }
  state.loginError = '';
  state.user = user; state.role = admin ? 'admin' : 'student';
  state.screen = 'loading'; render();
  await loadSettings();
  state.serverGrading = false;
  if(backend.call && CONFIG.SERVER_GRADING !== false){
    try{ await Promise.race([backend.call('ping', {}), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]); state.serverGrading = true; }
    catch(e){ console.info('Correzione sul server non attiva:', e.message || e); }
  }
  if(admin){
    state.screen = 'courses';
  } else {
    try{
      const ids = Object.keys(COURSES);
      const docs = await Promise.all(ids.map(id => backend.load(COURSES[id].coll, user.uid)));
      state.docs = Object.fromEntries(ids.map((id,i) => [id, docs[i] ? migrateDoc(docs[i]) : null]));
      state.student = null;
      state.classe = Object.values(state.docs).map(d => d?.classe).find(Boolean) || null;
      state.screen = state.classe ? 'courses' : 'classPick';
    }catch(e){
      console.error(e);
      state.loginError = 'Impossibile leggere i tuoi progressi (' + (e.code||e.message) + ').';
      await backend.signOut(); return;
    }
  }
  render();
}

(async function boot(){
  render();
  if(firebaseConfigured()){
    if(location.protocol === 'file:'){
      state.fatal = 'Il login Google non funziona aprendo il file dal computer: pubblica la pagina su un sito (es. Firebase Hosting) e aggiungi il dominio tra quelli autorizzati.';
      state.screen = 'login'; render(); return;
    }
    try{ backend = await makeFirebaseBackend(CONFIG.firebase); }
    catch(e){ console.error(e); state.fatal = 'Impossibile caricare Firebase: controlla la connessione e la configurazione.'; state.screen='login'; render(); return; }
  } else {
    backend = makeLocalBackend();
  }
  backend.onAuth(u => { handleAuth(u).catch(err => { console.error(err); state.fatal = String(err.message||err); state.screen='login'; render(); }); });
})();
